      for (let f = 0; f < 2; f++)
        for (let i = 0; i < 5; i++) ctx.fillRect(x - 64 + i * 27, b - 92 + f * 30, 15, 20);
      ctx.fillStyle = col;                        // the projecting canopy
      ctx.fillRect(x - 88, b - 46, 176, 14);
      ctx.fillStyle = '#c9a24a';
      for (let i = 0; i < 13; i++) {              // bulbs chasing along the edge
        const on = (Math.floor(timer / 5) + i) % 4 !== 0;
        ctx.fillStyle = on ? '#fff0c0' : 'rgba(255,240,192,.28)';
        ctx.fillRect(x - 84 + i * 14, b - 34, 3.4, 3.4);
      }
      marquee(x, b - 62, 116, 'ANGINE');
      ctx.fillStyle = 'rgba(255,214,140,.24)';    // doors
      for (let i = 0; i < 3; i++) ctx.fillRect(x - 40 + i * 30, b - 28, 20, 28);
      venueQueue(x - 108, b, 15);
      break;
    }
    case 'cntower': {                       // the obvious one, in the snow
      ctx.fillStyle = col;
      ctx.beginPath();                            // tapering shaft
      ctx.moveTo(x - 15, b); ctx.lineTo(x - 6, b - 150);
      ctx.lineTo(x + 6, b - 150); ctx.lineTo(x + 15, b); ctx.fill();
      ctx.fillRect(x - 12, b - 8, 24, 8);
      ctx.beginPath();                            // the main pod
      ctx.moveTo(x - 26, b - 150); ctx.lineTo(x + 26, b - 150);
      ctx.lineTo(x + 20, b - 168); ctx.lineTo(x - 20, b - 168); ctx.fill();
      ctx.fillStyle = 'rgba(220,240,255,.35)';    // the lit ring
      ctx.fillRect(x - 24, b - 162, 48, 7);
      ctx.fillStyle = col;
      ctx.fillRect(x - 9, b - 186, 18, 18);       // upper pod
      ctx.fillRect(x - 2.5, b - 214, 5, 28);      // the mast
      ctx.fillStyle = '#e04a3a';                  // aircraft light
      if (Math.floor(timer / 22) % 2) { ctx.fillRect(x - 2, b - 220, 4, 4); }
      ctx.fillStyle = '#f4f8ff';                  // snow on the pod ledges
      ctx.fillRect(x - 26, b - 152, 52, 3);
      ctx.fillRect(x - 9, b - 188, 18, 3);
      break;
    }
    case 'domeroof': {                      // the stadium beside it, roof shut
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.ellipse(x, b, 86, 52, 0, Math.PI, 0); ctx.fill();
      ctx.fillRect(x - 86, b - 14, 172, 14);
      ctx.fillStyle = 'rgba(255,255,255,.10)';    // the panel seams
      for (let i = 1; i < 4; i++) {
        ctx.beginPath(); ctx.ellipse(x, b, 86 - i * 21, 52 - i * 12, 0, Math.PI, 0);
        ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(255,255,255,.14)'; ctx.stroke();
      }
      ctx.fillStyle = '#f4f8ff';                  // snow lying on the dome
      ctx.beginPath(); ctx.ellipse(x, b - 50, 30, 6, 0, Math.PI, 0); ctx.fill();
      ctx.fillStyle = 'rgba(255,214,150,.18)';
      for (let i = 0; i < 8; i++) ctx.fillRect(x - 76 + i * 20, b - 11, 12, 7);
      break;
    }
    case 'venueMassey': {                   // a brick hall with arched windows
      ctx.fillStyle = '#6b4438'; ctx.fillRect(x - 78, b - 96, 156, 96);
      ctx.fillStyle = 'rgba(0,0,0,.18)';          // brick courses
      for (let i = 0; i < 9; i++) ctx.fillRect(x - 78, b - 92 + i * 10, 156, 1.4);
      ctx.fillStyle = 'rgba(255,214,150,.26)';    // arched windows
      for (let i = 0; i < 5; i++) {
        const wx = x - 60 + i * 30;
        ctx.beginPath(); ctx.arc(wx, b - 62, 9, Math.PI, 0); ctx.fill();
        ctx.fillRect(wx - 9, b - 62, 18, 26);
      }
      ctx.fillStyle = '#5a3830';                  // the canopy
      ctx.fillRect(x - 86, b - 34, 172, 12);
      ctx.fillStyle = '#f4f8ff'; ctx.fillRect(x - 86, b - 37, 172, 4);   // snow on it
      ctx.fillRect(x - 78, b - 99, 156, 5);
      marquee(x, b - 56, 104, 'ANGINE');
      ctx.fillStyle = 'rgba(255,214,140,.28)';
      for (let i = 0; i < 3; i++) ctx.fillRect(x - 40 + i * 30, b - 22, 20, 22);
      venueQueue(x - 110, b, 14);
      break;
    }
    case 'mountroyal': {
      ctx.beginPath(); ctx.moveTo(x - 130, b);
      ctx.bezierCurveTo(x - 70, b - 96, x + 40, b - 104, x + 130, b);
      ctx.fill();
      // treeline notches
      for (let i = -110; i < 110; i += 11) {
        const yy = b - 96 * Math.max(0, Math.cos(i / 130 * 1.5)) + 8;
        ctx.beginPath(); ctx.moveTo(x + i, yy + 10); ctx.lineTo(x + i + 5, yy - 6);
        ctx.lineTo(x + i + 10, yy + 10); ctx.fill();
      }
      ctx.fillStyle = 'rgba(243,230,210,.75)';
      ctx.fillRect(x - 2, b - 148, 4, 44); ctx.fillRect(x - 13, b - 132, 26, 4);
      break;
    }
    case 'olympic': {
      ctx.beginPath(); ctx.ellipse(x, b, 78, 26, 0, Math.PI, 0); ctx.fill();
      ctx.fillRect(x - 78, b - 6, 156, 6);
      ctx.beginPath();
      ctx.moveTo(x + 36, b); ctx.quadraticCurveTo(x + 84, b - 108, x + 22, b - 158);
      ctx.lineTo(x + 6, b - 148); ctx.quadraticCurveTo(x + 62, b - 100, x + 18, b);
      ctx.fill();
      break;
    }
    case 'downtown': {
      const hs = [78, 118, 62, 148, 92, 70, 108, 58];
      hs.forEach((h, i) => {
        ctx.fillRect(x - 110 + i * 28, b - h, 23, h);
        if (theme.night) {
          ctx.fillStyle = 'rgba(255,206,74,.22)';
          for (let w = 0; w < h / 16; w++) ctx.fillRect(x - 105 + i * 28, b - h + 8 + w * 15, 12, 5);
          ctx.fillStyle = col;
        }
      });
      break;
    }
    case 'mill': {
      ctx.fillRect(x - 60, b - 54, 130, 54);
      ctx.fillRect(x - 36, b - 116, 13, 64);
      ctx.fillRect(x + 4, b - 136, 13, 84);
      ctx.fillRect(x + 40, b - 100, 11, 48);
      ctx.fillStyle = 'rgba(243,230,210,.10)';
      for (let i = 0; i < 4; i++) {
        const t = (timer * .3 + i * 40) % 160;
        ctx.beginPath(); ctx.arc(x + 10 + t * .3, b - 140 - t * .5, 10 + t * .11, 0, Math.PI * 2); ctx.fill();
      }
      break;
    }
    case 'bridge': {
      ctx.fillRect(x - 150, b - 34, 300, 6);
      ctx.beginPath();
      ctx.moveTo(x - 150, b - 34); ctx.quadraticCurveTo(x, b - 140, x + 150, b - 34);
      ctx.lineTo(x + 150, b - 27); ctx.quadraticCurveTo(x, b - 128, x - 150, b - 27);
      ctx.fill();
      for (let i = -132; i <= 132; i += 22) {
        const yy = b - 34 - (1 - (i / 150) ** 2) * 100;
        ctx.fillRect(x + i, yy, 2, (b - 34) - yy);
      }
      ctx.fillRect(x - 150, b - 34, 6, 34); ctx.fillRect(x + 144, b - 34, 6, 34);
      break;
    }
    case 'cliff': {
      ctx.beginPath();
      ctx.moveTo(x - 120, b); ctx.lineTo(x - 66, b - 118);
      ctx.lineTo(x - 20, b - 138); ctx.lineTo(x + 130, b - 146);
      ctx.lineTo(x + 130, b); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,.22)';
      for (let i = 0; i < 5; i++) ctx.fillRect(x - 50 + i * 34, b - 132 + i * 6, 3, 120);
      break;
    }
    case 'frontenac': {
      ctx.fillRect(x - 78, b - 96, 156, 96);
      const turret = (tx, h, w) => {
        ctx.fillRect(tx - w / 2, b - 96 - h, w, h);
        ctx.beginPath();
        ctx.moveTo(tx - w / 2 - 4, b - 96 - h); ctx.lineTo(tx, b - 96 - h - 34);
        ctx.lineTo(tx + w / 2 + 4, b - 96 - h); ctx.fill();
      };
      turret(x, 68, 42); turret(x - 58, 34, 24); turret(x + 58, 34, 24);
      turret(x - 30, 20, 16); turret(x + 30, 20, 16);
      ctx.fillStyle = 'rgba(255,206,74,.20)';
      for (let i = 0; i < 8; i++) ctx.fillRect(x - 66 + i * 18, b - 74, 7, 11);
      break;
    }
    case 'falls': {
      ctx.fillRect(x - 96, b - 140, 46, 140);
      ctx.fillRect(x + 48, b - 140, 46, 140);
      ctx.fillStyle = 'rgba(243,246,255,.34)';
      ctx.fillRect(x - 50, b - 140, 98, 140);
      ctx.fillStyle = 'rgba(243,246,255,.20)';
      for (let i = 0; i < 6; i++) {
        const yy = b - 140 + ((timer * 1.4 + i * 24) % 140);
        ctx.fillRect(x - 46 + i * 16, yy, 5, 22);
      }
      ctx.fillStyle = 'rgba(243,246,255,.16)';
      ctx.beginPath(); ctx.ellipse(x, b, 66, 14, 0, 0, Math.PI * 2); ctx.fill();
      break;
    }
    case 'parliament': {
      ctx.fillRect(x - 108, b - 72, 216, 72);
      for (let i = 0; i < 9; i++) {                       // gothic roofline
        ctx.beginPath();
        ctx.moveTo(x - 108 + i * 24, b - 72); ctx.lineTo(x - 96 + i * 24, b - 96);
        ctx.lineTo(x - 84 + i * 24, b - 72); ctx.fill();
      }
      ctx.fillRect(x - 19, b - 168, 38, 100);             // Peace Tower
      ctx.beginPath();
      ctx.moveTo(x - 24, b - 168); ctx.lineTo(x, b - 220); ctx.lineTo(x + 24, b - 168); ctx.fill();
      ctx.fillStyle = 'rgba(255,206,74,.7)';
      ctx.beginPath(); ctx.arc(x, b - 152, 8, 0, Math.PI * 2); ctx.fill();
      break;
    }
    case 'locks': {
      for (let i = 0; i < 8; i++) {
        ctx.fillStyle = col; ctx.fillRect(x - 100 + i * 26, b - 14 - i * 15, 26, 14 + i * 15);
        ctx.fillStyle = theme.water; ctx.fillRect(x - 100 + i * 26, b - 14 - i * 15, 22, 6);
      }
      break;
    }
    case 'sacrecoeur': {
      ctx.fillRect(x - 70, b - 52, 140, 52);
      const dome = (dx, r) => {
        ctx.beginPath(); ctx.arc(x + dx, b - 52, r, Math.PI, 0); ctx.fill();
        ctx.fillRect(x + dx - 4, b - 52 - r - 16, 8, 18);
      };
      dome(0, 40); dome(-54, 20); dome(54, 20);
      ctx.fillStyle = 'rgba(0,0,0,.18)';
      for (let i = 0; i < 6; i++) ctx.fillRect(x - 60 + i * 22, b - 40, 8, 40);
      break;
    }
    case 'arc': {
      ctx.fillRect(x - 56, b - 92, 112, 92);
      ctx.fillStyle = theme.sky[1];
      ctx.fillRect(x - 20, b - 58, 40, 58);
      ctx.beginPath(); ctx.arc(x, b - 58, 20, Math.PI, 0); ctx.fill();
      break;
    }
    case 'eiffel': {
      ctx.beginPath();
      ctx.moveTo(x - 66, b); ctx.lineTo(x - 16, b - 112);
      ctx.lineTo(x - 5, b - 214); ctx.lineTo(x + 5, b - 214);
      ctx.lineTo(x + 16, b - 112); ctx.lineTo(x + 66, b);
      ctx.lineTo(x + 40, b); ctx.lineTo(x + 8, b - 100);
      ctx.lineTo(x - 8, b - 100); ctx.lineTo(x - 40, b); ctx.fill();
      ctx.fillRect(x - 38, b - 102, 76, 7);
      ctx.fillRect(x - 21, b - 150, 42, 6);
      ctx.beginPath(); ctx.moveTo(x - 66, b); ctx.quadraticCurveTo(x, b - 40, x + 66, b);
      ctx.lineTo(x + 54, b); ctx.quadraticCurveTo(x, b - 28, x - 54, b); ctx.fill();
      ctx.fillStyle = 'rgba(255,206,74,.85)';
      ctx.fillRect(x - 2, b - 228, 4, 14);
      // the beacon: two beams turning from the summit. At this scale the top
      // sits above the frame, so the beams are what actually reads on screen.
      const sweep = timer * .012;
      [0, Math.PI].forEach(off => {
        const a2 = sweep + off;
        ctx.save();
        ctx.globalAlpha = .13 + .07 * Math.abs(Math.cos(a2));
        ctx.fillStyle = '#fff0c0';
        ctx.translate(x, b - 224); ctx.rotate(a2);
        ctx.beginPath();
        ctx.moveTo(0, 0); ctx.lineTo(300, -9); ctx.lineTo(300, 9); ctx.fill();
        ctx.restore();
      });
      // the hourly sparkle, running up the ironwork
      for (let i = 0; i < 22; i++) {
        if ((Math.floor(timer / 3) * 7 + i * 13) % 9 > 6) continue;
        const ty = b - 20 - i * 9.6, tw = 52 * (1 - i / 24);
        ctx.fillStyle = 'rgba(255,255,255,.55)';
        ctx.fillRect(x - tw / 2 + ((i * 37) % Math.max(1, tw)), ty, 2, 2);
      }
      break;
    }
  }
}

// layer 3 — the street wall right behind play, ~0.6 parallax
function drawMidLayer() {
  const W = VW, H = VH;   // viewport, not canvas
  const b = H - 6 - camY * .3;
  ctx.fillStyle = theme.mid;
  const kind = theme.midkind;
  const span = 96;
  const base = Math.floor(cam * .6 / span);
  const n = Math.ceil(W / span) + 3;

  for (let i = -1; i < n; i++) {
    const slot = base + i;                        // stable per world position
    const x = slot * span - cam * .6;
    const s = bgSeed[((slot % 70) + 70) % 70 + 5];
    const h = 62 + s.a * 54;

    if (kind === 'triplex') {                     // Montréal walk-ups with outdoor stairs
      ctx.fillStyle = theme.mid;
      ctx.fillRect(x, b - h, span - 10, h);
      ctx.fillStyle = 'rgba(0,0,0,.28)';
      for (let f = 0; f < 3; f++) for (let w = 0; w < 3; w++)
        ctx.fillRect(x + 12 + w * 24, b - h + 12 + f * 26, 12, 16);
      ctx.strokeStyle = 'rgba(243,230,210,.20)'; ctx.lineWidth = 2;   // the spiral staircase
      ctx.beginPath();
      ctx.moveTo(x + 8, b); ctx.quadraticCurveTo(x + 40, b - 26, x + 20, b - 48);
      ctx.stroke();
    } else if (kind === 'mill') {
      ctx.fillRect(x, b - h * .8, span - 8, h * .8);
      ctx.fillRect(x + 20, b - h * .8 - 34, 12, 34);
      ctx.fillStyle = 'rgba(0,0,0,.25)';
      for (let w = 0; w < 5; w++) ctx.fillRect(x + 8 + w * 16, b - h * .7, 9, 20);
    } else if (kind === 'ramparts') {
      ctx.fillRect(x, b - h * .6, span - 6, h * .6);
      for (let m = 0; m < 5; m++) ctx.fillRect(x + m * 20, b - h * .6 - 12, 12, 12);
      ctx.fillStyle = 'rgba(0,0,0,.22)';
      ctx.fillRect(x + 30, b - h * .5, 14, 26);
    } else if (kind === 'gothic') {
      ctx.fillRect(x, b - h, span - 12, h);
      ctx.beginPath();
      ctx.moveTo(x, b - h); ctx.lineTo(x + (span - 12) / 2, b - h - 26);
      ctx.lineTo(x + span - 12, b - h); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,.28)';
      for (let w = 0; w < 3; w++) {
        ctx.beginPath();
        ctx.moveTo(x + 14 + w * 24, b - 10); ctx.lineTo(x + 14 + w * 24, b - h + 26);
        ctx.lineTo(x + 24 + w * 24, b - h + 14); ctx.lineTo(x + 34 + w * 24, b - h + 26);
        ctx.lineTo(x + 34 + w * 24, b - 10); ctx.fill();
      }
    } else if (kind === 'festival') {            // stalls, gantries, and the crowd itself
      ctx.fillStyle = theme.mid;
      const h2 = 42 + s.a * 26;
      ctx.fillRect(x, b - h2, span - 14, h2);
      ctx.beginPath();                            // awning over each stall
      ctx.moveTo(x - 6, b - h2);
      ctx.lineTo(x + (span - 14) / 2, b - h2 - 12);
      ctx.lineTo(x + span - 8, b - h2); ctx.fill();
      ctx.fillStyle = 'rgba(255,214,140,.20)';    // stall lights
      ctx.fillRect(x + 8, b - h2 + 10, span - 30, 8);
      ctx.fillStyle = 'rgba(243,230,210,.16)';    // festoon lights strung between
      for (let i = 0; i < 5; i++) {
        const lx = x + 6 + i * 18, sag = Math.sin(i * .9) * 3;
        ctx.fillRect(lx, b - h2 - 20 + sag, 2, 2);
      }
      // the crowd: rows of bobbing silhouettes, nearer rows darker
      for (let row = 0; row < 2; row++) {
        const cy = b - 6 - row * 9;
        ctx.fillStyle = row ? 'rgba(10,12,28,.55)' : 'rgba(6,8,20,.8)';
        for (let i = 0; i < 8; i++) {
          const hx = x + i * 12 + row * 5;
          const hb = Math.sin(timer * .06 + i * 1.3 + row * 2 + x * .01) * 1.8;
          ctx.beginPath(); ctx.arc(hx, cy - 10 + hb, 3.2, 0, Math.PI * 2); ctx.fill();
          ctx.fillRect(hx - 3.4, cy - 7 + hb, 6.8, 10);
        }
      }
    } else if (kind === 'winter') {
      const h4 = 58 + s.a * 40;
      ctx.fillStyle = theme.mid;
      ctx.fillRect(x, b - h4, span - 10, h4);
      ctx.fillStyle = 'rgba(0,0,0,.28)';           // upper windows
      for (let f = 0; f < 2; f++) for (let w = 0; w < 3; w++)
        ctx.fillRect(x + 10 + w * 24, b - h4 + 12 + f * 22, 13, 15);
      ctx.fillStyle = 'rgba(255,214,150,.24)';     // lit shopfront
      ctx.fillRect(x + 6, b - 28, span - 26, 20);
      ctx.fillStyle = '#f4f8ff';                   // snow on every ledge
      ctx.fillRect(x - 2, b - h4 - 4, span - 6, 5);
      ctx.fillRect(x + 4, b - 33, span - 22, 4);
      if (fxLevel && slot % 3 === 0) {             // a streetcar going the other way
        const cx = x - ((timer * .5) % (span * 3));
        ctx.fillStyle = '#b03a30'; ctx.fillRect(cx, b - 34, 74, 26);
        ctx.fillStyle = '#f0ece0'; ctx.fillRect(cx, b - 34, 74, 5);
        ctx.fillStyle = 'rgba(220,240,255,.4)';
        for (let i = 0; i < 5; i++) ctx.fillRect(cx + 5 + i * 14, b - 27, 9, 9);
        ctx.fillStyle = '#2a2630';
        ctx.beginPath(); ctx.arc(cx + 16, b - 7, 4, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(cx + 58, b - 7, 4, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#8a8478'; ctx.fillRect(cx + 34, b - 46, 2, 12);   // pole
      }
      ctx.fillStyle = '#e8f0fb';                   // banked snow at the kerb
      ctx.beginPath();
      ctx.moveTo(x - 4, b + 4); ctx.quadraticCurveTo(x + span * .4, b - 12, x + span, b + 4);
      ctx.fill();
      ctx.fillStyle = theme.mid;
    } else if (kind === 'nightlife') {           // a strip of bars, clubs and neon
      const NEON = ['#ff4f9a', '#4fe0ff', '#ffce4a', '#8a6bff', '#5cf07f'];
      const hue = NEON[Math.floor(Math.abs(slot)) % NEON.length];
      const h3 = 66 + s.a * 46;
      ctx.fillStyle = theme.mid;
      ctx.fillRect(x, b - h3, span - 10, h3);

      // upper storeys: apartment windows, some lit, some not
      for (let f = 0; f < 3; f++) for (let w = 0; w < 3; w++) {
        const on = ((slot * 7 + f * 3 + w) % 5) < 2;
        ctx.fillStyle = on ? 'rgba(255,206,120,.30)' : 'rgba(0,0,0,.3)';
        ctx.fillRect(x + 10 + w * 22, b - h3 + 12 + f * 18, 13, 12);
      }

      // the ground-floor frontage, brightly lit
      ctx.fillStyle = 'rgba(0,0,0,.45)';
      ctx.fillRect(x + 2, b - 40, span - 14, 40);
      ctx.fillStyle = 'rgba(255,190,110,.16)';    // window glow onto the street
      ctx.fillRect(x + 6, b - 34, span - 24, 24);
      ctx.fillStyle = 'rgba(0,0,0,.55)';          // punters at the bar, in silhouette
      for (let i = 0; i < 3; i++) {
        const px2 = x + 12 + i * 18, hb = Math.sin(timer * .04 + i + slot) * .8;
        ctx.beginPath(); ctx.arc(px2, b - 24 + hb, 3, 0, Math.PI * 2); ctx.fill();
        ctx.fillRect(px2 - 3, b - 21 + hb, 6, 11);
      }

      // awning over the door, and the light spilling out of it
      ctx.fillStyle = hue;
      ctx.globalAlpha = .55;
      ctx.beginPath();
      ctx.moveTo(x + 2, b - 44); ctx.lineTo(x + span - 12, b - 44);
      ctx.lineTo(x + span - 18, b - 36); ctx.lineTo(x + 8, b - 36); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = 'rgba(255,214,140,.13)';    // doorway spill on the pavement
      ctx.beginPath();
      ctx.moveTo(x + 20, b - 34); ctx.lineTo(x + 34, b - 34);
      ctx.lineTo(x + 44, b + 6); ctx.lineTo(x + 10, b + 6); ctx.fill();

      // vertical marquee with chasing bulbs — the loud one
      if (slot % 2 === 0) {
        ctx.fillStyle = '#0a0812';
        ctx.fillRect(x + span - 26, b - h3 - 14, 13, 54);
        ctx.fillStyle = hue;
        ctx.fillRect(x + span - 24, b - h3 - 12, 9, 50);
        ctx.fillStyle = 'rgba(0,0,0,.55)';
        for (let i = 0; i < 6; i++) ctx.fillRect(x + span - 22, b - h3 - 8 + i * 8, 5, 4);
        for (let i = 0; i < 7; i++) {             // bulbs running up the edge
          const on = (Math.floor(timer / 6) + i) % 3 === 0;
          ctx.fillStyle = on ? '#fff3cf' : 'rgba(255,243,207,.25)';
          ctx.fillRect(x + span - 27, b - h3 - 10 + i * 8, 2.4, 2.4);
          ctx.fillRect(x + span - 12, b - h3 - 10 + i * 8, 2.4, 2.4);
        }
      } else {
        // horizontal neon script above the window, flickering now and then
        const lit = (Math.floor(timer / 9) + slot) % 11 !== 0;
        ctx.fillStyle = lit ? hue : 'rgba(120,120,140,.3)';
        ctx.fillRect(x + 10, b - 52, span - 32, 3.4);
        for (let i = 0; i < 4; i++)
          ctx.fillRect(x + 12 + i * 14, b - 60, 3.4, 9);
        if (lit) {                                 // the glow it throws
          ctx.globalAlpha = .16;
          ctx.fillRect(x + 4, b - 66, span - 20, 22);
          ctx.globalAlpha = 1;
        }
      }
      ctx.fillStyle = theme.mid;
    } else if (kind === 'haussmann') {            // uniform façades with mansard roofs
      ctx.fillRect(x, b - h, span - 8, h);
      ctx.beginPath();
      ctx.moveTo(x - 2, b - h); ctx.lineTo(x + 12, b - h - 22);
      ctx.lineTo(x + span - 20, b - h - 22); ctx.lineTo(x + span - 6, b - h); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,.26)';
      for (let f = 0; f < 4; f++) for (let w = 0; w < 4; w++)
        ctx.fillRect(x + 9 + w * 21, b - h + 10 + f * 22, 11, 15);
      ctx.fillStyle = 'rgba(243,230,210,.14)';    // wrought-iron balcony line
      ctx.fillRect(x, b - h + 54, span - 8, 2);
    } else if (kind === 'fjord') {                 // cliff face, spruce, an empty wharf
      const h5 = 50 + s.a * 60;
      ctx.fillStyle = theme.mid;
      ctx.beginPath();                             // a jagged rock face, not a building
      ctx.moveTo(x, b);
      ctx.lineTo(x + 6, b - h5 * .5); ctx.lineTo(x + 18, b - h5 * .42);
      ctx.lineTo(x + 26, b - h5); ctx.lineTo(x + 40, b - h5 * .7);
      ctx.lineTo(x + 54, b - h5 * .9); ctx.lineTo(x + span - 10, b - h5 * .35);
      ctx.lineTo(x + span - 10, b); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,.22)';            // shaded fissures
      for (let f = 0; f < 3; f++)
        ctx.fillRect(x + 10 + f * 22, b - h5 * .3 - f * 8, 3, h5 * .3 + f * 8);
      // a lone spruce or two, black against the pre-dawn sky
      if (s.b > .4) {
        const tx2 = x + 10 + s.c * (span - 30), th = 22 + s.b * 14, ty2 = b - h5 * .85;
        ctx.fillStyle = '#0a161e';
        for (let t2 = 0; t2 < 4; t2++) {
          const wth = th * .5 * (1 - t2 / 5);
          ctx.beginPath();
          ctx.moveTo(tx2, ty2 - th + t2 * (th / 4.4));
          ctx.lineTo(tx2 - wth, ty2 - t2 * (th / 5) + th * .16);
          ctx.lineTo(tx2 + wth, ty2 - t2 * (th / 5) + th * .16);
          ctx.closePath(); ctx.fill();
        }
        ctx.fillRect(tx2 - 1.5, ty2, 3, 6);
      }
      if (slot % 4 === 0) {                        // a small, unmanned wharf
        ctx.fillStyle = 'rgba(0,0,0,.3)';
        ctx.fillRect(x + span * .3, b - 6, span * .5, 6);
        ctx.fillStyle = '#0a161e';
        for (let p2 = 0; p2 < 3; p2++) ctx.fillRect(x + span * .3 + p2 * span * .24, b - 2, 3, 10);
      }
    }
  }

  const hz = ctx.createLinearGradient(0, H - 90, 0, H);
  hz.addColorStop(0, 'rgba(0,0,0,0)'); hz.addColorStop(1, theme.haze);
  ctx.fillStyle = hz; ctx.fillRect(0, H - 90, W, 90);
}

// ============================ foreground draw ============================
// Snow was rebuilt: it used to recompute two sines and four modulos per flake
// per frame and issue ~80 separate fillRect calls. Now the flakes are real
// particles updated once per tick and drawn as two batched paths.
let snowField = null;

function initSnow() {
  if (!theme.snow) { snowField = null; return; }
  const mk = (n, near) => {
    const a = [];
    for (let i = 0; i < n; i++) a.push({
      x: Math.random() * (VW + 40), y: Math.random() * (VH + 40),
      fall: near ? 1.15 + Math.random() * .7 : .45 + Math.random() * .3,
      sway: (near ? .5 : .25) * (.6 + Math.random() * .8),
      phase: Math.random() * 6.28
    });
    return a;
  };
  snowField = { near: mk(26, true), far: mk(30, false), drift: 0 };
}

function updateSnow() {
  if (!snowField) return;
  snowField.drift += .012;
  const d = Math.sin(snowField.drift);           // one sine per frame, not one per flake
  for (const layer of [snowField.near, snowField.far]) {
    for (const f of layer) {
      f.y += f.fall;
      f.x += d * f.sway;
      if (f.y > VH + 20) { f.y = -10; f.x = Math.random() * (VW + 40); }
      if (f.x < -20) f.x += VW + 40;
      else if (f.x > VW + 20) f.x -= VW + 40;
    }
  }
}

// one path, one fill, per layer
function drawSnow(near) {
  if (!snowField) return;
  const layer = near ? snowField.near : snowField.far;
  const sz = near ? 2.2 : 1.3;
  const par = near ? .5 : .18;
  const off = (cam * par) % (VW + 40);
  ctx.fillStyle = near ? 'rgba(255,255,255,.72)' : 'rgba(230,240,255,.38)';
  ctx.beginPath();
  for (let i = 0; i < layer.length; i++) {
    const f = layer[i];
    let x = f.x - off;
    if (x < -20) x += VW + 40;
    ctx.rect(x, f.y, sz, sz);
  }
  ctx.fill();
}

function drawTiles() {
  const W = VW, H = VH;   // viewport, not canvas
  const first = Math.max(0, Math.floor(cam / TILE) - 1);
  const last = Math.min(COLS, first + Math.ceil(W / TILE) + 3);
  const r0 = Math.max(0, Math.floor(camY / TILE) - 1);
  const r1 = Math.min(ROWS, r0 + Math.ceil(H / TILE) + 3);

  for (let r = r0; r < r1; r++) for (let c = first; c < last; c++) {
    const ch = grid[r][c];
    if (ch !== '#' && ch !== '=') continue;
    const x = c * TILE - cam, y = r * TILE - camY;
    ctx.fillStyle = ch === '#' ? theme.ground : theme.plat;
    ctx.fillRect(x, y, TILE, TILE);
    if (!solidAt(c, r - 1)) {
      ctx.fillStyle = theme.edge; ctx.fillRect(x, y, TILE, 4);
      ctx.fillStyle = 'rgba(255,255,255,.08)'; ctx.fillRect(x, y + 4, TILE, 3);
      if (theme.snow) {                              // a lip of snow, drifted unevenly
        ctx.fillStyle = '#f4f8ff';
        ctx.fillRect(x, y - 3, TILE, 4);
        const bump = ((c * 7) % 3) + 1;
        ctx.fillRect(x + ((c * 5) % 12), y - 3 - bump, 9, bump + 1);
      }
    }
    if (!solidAt(c - 1, r)) { ctx.fillStyle = 'rgba(255,255,255,.06)'; ctx.fillRect(x, y, 2, TILE); }
    ctx.fillStyle = 'rgba(0,0,0,.20)'; ctx.fillRect(x, y + TILE - 3, TILE, 3);
  }
}

function drawMovers() {
  const W = VW, H = VH;   // viewport, not canvas
  for (const m of movers) {
    const x = m.x - cam, y = m.y - camY;
    if (x < -90 || x > W + 90) continue;
    ctx.fillStyle = '#15101e'; ctx.fillRect(x, y, m.w, m.h);
    ctx.fillStyle = '#ffce4a'; ctx.fillRect(x, y, m.w, 3);
    ctx.fillStyle = 'rgba(255,206,74,.4)';
    for (let i = 0; i < Math.floor(m.w / 12); i++) ctx.fillRect(x + 4 + i * 12, y + m.h + 2, 4, 2);
  }
}

function drawTires() {
  const W = VW, H = VH;   // viewport, not canvas
  for (const t of tires) {
    const x = t.x - cam, y = t.y - camY + (t.squash ? 4 : 0);
    if (x < -40 || x > W + 40) continue;
    const sq = t.squash ? .6 : 1, cx = x + TILE / 2, cy = y + 6;
    // a tyre is a torus, not a disc: dark carcass, lit upper shoulder, sunken
    // hub, and tread blocks that turn so it reads as a solid of revolution
    ctx.fillStyle = '#0f0d15';
    ctx.beginPath(); ctx.ellipse(cx, cy + 1, 12, 9 * sq, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#191622';
    ctx.beginPath(); ctx.ellipse(cx, cy, 12, 9 * sq, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.13)';
    ctx.beginPath(); ctx.ellipse(cx, cy - 1.2, 11, 8 * sq, 0, Math.PI * 1.08, Math.PI * 1.92); ctx.fill();
    const roll = timer * .035 + t.x * .07;
    ctx.fillStyle = 'rgba(0,0,0,.45)';
    for (let i = 0; i < 8; i++) {
      const a = roll + i * Math.PI / 4;
      ctx.fillRect(cx + Math.cos(a) * 9.6 - 1, cy + Math.sin(a) * 7.2 * sq - 1, 2.2, 2.2);
    }
    ctx.fillStyle = 'rgba(0,0,0,.5)';
    ctx.beginPath(); ctx.ellipse(cx, cy + .6, 6.6, 5 * sq, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = theme.edge;
    ctx.beginPath(); ctx.ellipse(cx, cy, 6, 4.5 * sq, 0, 0, Math.PI * 2); ctx.fill();
  }
}

function drawBarrels() {
  const W = VW, H = VH;   // viewport, not canvas
  for (const b of barrels) {
    const x = b.x - cam, y = b.y - camY;
    if (x < -50 || x > W + 50) continue;
    const cx = x + b.w / 2, cy = y + b.h / 2;
    ctx.fillStyle = '#6b4426'; ctx.fillRect(x, y, b.w, b.h);
    ctx.fillStyle = '#8a5a32'; ctx.fillRect(x + 3, y, 5, b.h); ctx.fillRect(x + 13, y, 5, b.h);
    ctx.fillStyle = '#c9a06a'; ctx.fillRect(x, y + 4, b.w, 3); ctx.fillRect(x, y + b.h - 8, b.w, 3);
    if (player.inBarrel === b) {                 // aim line while you're loaded
      ctx.strokeStyle = 'rgba(255,206,74,.85)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(b.ang) * 30, cy + Math.sin(b.ang) * 30); ctx.stroke();
      ctx.fillStyle = '#ffce4a';
      ctx.beginPath();
      ctx.arc(cx + Math.cos(b.ang) * 32, cy + Math.sin(b.ang) * 32, 3, 0, Math.PI * 2); ctx.fill();
    }
  }
}

function drawCoins() {
  const W = VW, H = VH;   // viewport, not canvas
  for (const c of coins) {
    if (c.got) continue;
    const x = c.x - cam, y = c.y - camY;
    if (x < -20 || x > W + 20) continue;
    const cs = Math.cos(c.t), wob = Math.abs(cs) * c.r + 1;
    const cyy = y + Math.sin(c.t) * 2;
    // a struck disc has thickness: the rim shows as the face turns edge-on,
    // and the face itself is darker when we are looking at its back
    ctx.fillStyle = '#a9761b';
    ctx.beginPath(); ctx.ellipse(x + (cs > 0 ? .8 : -.8), cyy, wob, c.r, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = cs > 0 ? '#ffce4a' : '#e0a72e';
    ctx.beginPath(); ctx.ellipse(x, cyy, Math.max(.6, wob - .8), c.r - .6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,' + (.15 + .35 * Math.abs(cs)).toFixed(2) + ')';
    ctx.fillRect(x - 1, cyy - 2, 1, 4);
  }
}

// a small emblem of the city, drawn at (x,y) in a 16px box
function souvenir(kind, x, y, col) {
  ctx.fillStyle = col;
  switch (kind) {
    case 'cross':                                  // the Mont-Royal cross
      ctx.fillRect(x + 6, y, 3, 16); ctx.fillRect(x + 1, y + 4, 13, 3); break;
    case 'stack':                                  // a mill chimney
      ctx.beginPath();
      ctx.moveTo(x + 4, y + 16); ctx.lineTo(x + 5, y + 2);
      ctx.lineTo(x + 10, y + 2); ctx.lineTo(x + 11, y + 16); ctx.fill();
      ctx.fillRect(x + 3, y + 5, 9, 2); break;
    case 'turret':                                 // a Château turret
      ctx.fillRect(x + 4, y + 7, 8, 9);
      ctx.beginPath();
      ctx.moveTo(x + 2, y + 7); ctx.lineTo(x + 8, y); ctx.lineTo(x + 14, y + 7); ctx.fill();
      break;
    case 'tulip':                                  // Ottawa's tulips
      ctx.fillRect(x + 7, y + 7, 2, 9);
      ctx.beginPath();
      ctx.moveTo(x + 3, y + 8); ctx.lineTo(x + 3, y + 3); ctx.lineTo(x + 6, y + 6);
      ctx.lineTo(x + 8, y + 1); ctx.lineTo(x + 10, y + 6); ctx.lineTo(x + 13, y + 3);
      ctx.lineTo(x + 13, y + 8); ctx.fill();
      break;
    case 'note':                                   // a quaver, for the setlists
      ctx.fillRect(x + 9, y + 1, 2, 11);
      ctx.beginPath(); ctx.ellipse(x + 6, y + 12, 4, 3, -.3, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(x + 11, y + 1); ctx.quadraticCurveTo(x + 16, y + 4, x + 11, y + 8);
      ctx.lineTo(x + 11, y + 5); ctx.fill();
      break;
    case 'spire':                                  // the Tower's tip
      ctx.beginPath();
      ctx.moveTo(x + 2, y + 16); ctx.lineTo(x + 7, y + 2); ctx.lineTo(x + 9, y + 2);
      ctx.lineTo(x + 14, y + 16); ctx.lineTo(x + 11, y + 16); ctx.lineTo(x + 8, y + 6);
      ctx.lineTo(x + 5, y + 16); ctx.fill();
      ctx.fillRect(x + 4, y + 11, 8, 2);
      ctx.fillRect(x + 7, y, 2, 3); break;
  }
}

function drawSouvenirs() {
  const W = VW, H = VH;   // viewport, not canvas
  for (const l of letters) {
    if (l.got) continue;
    const x = l.x - cam - 4, y = l.y - camY + Math.sin(timer * .06 + l.i) * 3;
    if (x < -30 || x > W + 30) continue;
    const pulse = .14 + .08 * Math.sin(timer * .08 + l.i);
    ctx.fillStyle = 'rgba(255,206,74,' + pulse.toFixed(2) + ')';
    ctx.beginPath(); ctx.arc(x + 8, y + 8, 14, 0, Math.PI * 2); ctx.fill();
    const sp = Math.cos(timer * .045 + l.i * 1.7);          // y-axis spin
    ctx.save();
    ctx.translate(x + 8, 0); ctx.scale(Math.max(.08, Math.abs(sp)), 1); ctx.translate(-(x + 8), 0);
    souvenir(L.token, x, y, sp > 0 ? '#ffce4a' : '#b8821c');  // back face sits in shadow
    ctx.restore();
  }
}

// ---- shared setup: face the way it walks, cast a shadow ----
// Apparent facing per enemy, kept outside the entity objects so nothing in
// update() can ever see it. Same trick as the player: the mirror eases across
// zero so a ledge turn reads as a pivot rather than a snap.
const enemyFace = new WeakMap();
function critter(e, x, y, draw) {
  const f = e.vx > 0 ? 1 : -1;
  let fv = enemyFace.get(e); if (fv === undefined) fv = f;
  fv += (f - fv) * .3; enemyFace.set(e, fv);
  const turn = Math.max(.12, Math.abs(fv));
  ctx.save();
  // shadow first, in unscaled space, so it matches the real footprint
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(x + 2, y + e.h - 1, e.w - 4, 2);
  // map the 22x20 drawing frame onto this species' box, anchored top-left
  ctx.translate(x, y); ctx.scale(e.w / 22, e.h / 20); ctx.translate(-x, -y);
  // then mirror about the drawing frame's centre, not the hitbox's
  if (f > 0) { ctx.translate(x + 11, 0); ctx.scale(-1, 1); ctx.translate(-(x + 11), 0); }
  if (turn < .995) { ctx.translate(x + 11, 0); ctx.scale(turn, 1); ctx.translate(-(x + 11), 0); }
  draw();
  ctx.restore();
}

// ---- a beaver: mill-town local, drags a paddle tail ----
function drawBeaver(e, x, y, bob) {
  const t = y + bob, step = Math.sin(timer * .2 + e.x) * 1.4;
  ctx.fillStyle = '#4a3524';                        // paddle tail
  ctx.beginPath(); ctx.ellipse(x + 19, t + 16, 5, 3.2, .3, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#3a291c';
  for (let i = 0; i < 3; i++) ctx.fillRect(x + 16 + i * 2, t + 14, 1, 5);
  ctx.fillStyle = '#6b4a2e';                        // body
  ctx.beginPath(); ctx.ellipse(x + 10, t + 12, 8.5, 6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#7d5836';
  ctx.beginPath(); ctx.ellipse(x + 5, t + 10, 5, 4.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#4a3524';                        // feet
  ctx.fillRect(x + 6 + step, t + 17, 3, 3); ctx.fillRect(x + 12 - step, t + 17, 3, 3);
  ctx.fillStyle = '#3a291c';                        // ear
  ctx.beginPath(); ctx.arc(x + 7, t + 6, 1.8, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#1a1220'; ctx.fillRect(x + 3, t + 8, 1.8, 1.8);   // eye
  ctx.fillStyle = '#2a1c12';                        // snout
  ctx.beginPath(); ctx.ellipse(x + 1, t + 11, 2, 1.6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#e8b84a'; ctx.fillRect(x + 1, t + 12, 2.4, 3);    // incisors
}

// ---- a raccoon: bandit mask, ringed tail, up to no good ----
function drawRaccoon(e, x, y, bob) {
  const t = y + bob, step = Math.sin(timer * .22 + e.x) * 1.5;
  ctx.fillStyle = '#5a5a63';                        // ringed tail
  ctx.beginPath(); ctx.ellipse(x + 19, t + 12, 4.5, 3, -.4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#26262e';
  ctx.fillRect(x + 17, t + 9, 2, 6); ctx.fillRect(x + 21, t + 10, 2, 5);
  ctx.fillStyle = '#6e6e78';                        // body
  ctx.beginPath(); ctx.ellipse(x + 10, t + 13, 8, 5.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#4a4a54';
  ctx.fillRect(x + 5 + step, t + 17, 3, 3); ctx.fillRect(x + 12 - step, t + 17, 3, 3);
  ctx.fillStyle = '#7d7d88';                        // head
  ctx.beginPath(); ctx.arc(x + 5, t + 8, 5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#4a4a54';                        // ears
  ctx.beginPath(); ctx.moveTo(x + 1, t + 5); ctx.lineTo(x + 2, t + 1); ctx.lineTo(x + 5, t + 4); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x + 6, t + 4); ctx.lineTo(x + 9, t + 1); ctx.lineTo(x + 9, t + 5); ctx.fill();
  ctx.fillStyle = '#1c1c22'; ctx.fillRect(x + 1, t + 6, 8, 3.5);     // the mask
  ctx.fillStyle = '#e8e2d4'; ctx.fillRect(x + 2, t + 7, 1.6, 1.6); ctx.fillRect(x + 6, t + 7, 1.6, 1.6);
  ctx.fillStyle = '#1a1220';
  ctx.beginPath(); ctx.arc(x, t + 11, 1.6, 0, Math.PI * 2); ctx.fill();
}

// ---- a pigeon: Parisian, iridescent, entirely unbothered ----
function drawPigeon(e, x, y, bob) {
  const t = y + bob, strut = Math.sin(timer * .26 + e.x);
  ctx.fillStyle = '#e08a3c';                        // feet
  ctx.fillRect(x + 8 + strut * 1.6, t + 17, 2, 3); ctx.fillRect(x + 12 - strut * 1.6, t + 17, 2, 3);
  ctx.fillStyle = '#6e727e';                        // body
  ctx.beginPath(); ctx.ellipse(x + 11, t + 13, 7.5, 5, .12, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#565a66';                        // wing
  ctx.beginPath(); ctx.ellipse(x + 12, t + 13, 5, 3, .3, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#3e424c';
  ctx.fillRect(x + 16, t + 13, 5, 2);               // tail
  ctx.fillStyle = '#7a7e8a';                        // head, bobbing with the strut
  ctx.beginPath(); ctx.arc(x + 5, t + 7 + strut * .8, 4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#4a7a6a';                        // iridescent throat
  ctx.fillRect(x + 3, t + 9 + strut * .8, 5, 3);
  ctx.fillStyle = '#e0463c';
  ctx.beginPath(); ctx.arc(x + 3, t + 5 + strut * .8, 1.4, 0, Math.PI * 2); ctx.fill();  // eye ring
  ctx.fillStyle = '#1a1220'; ctx.fillRect(x + 3, t + 5 + strut * .8, 1.4, 1.4);
  ctx.fillStyle = '#c9b8a8';                        // bill with its cere
  ctx.beginPath(); ctx.moveTo(x + 1, t + 6 + strut * .8);
  ctx.lineTo(x - 3, t + 7 + strut * .8); ctx.lineTo(x + 1, t + 8 + strut * .8); ctx.fill();
}
// ---- a skunk: tail up. Nothing about this says "jump on me". ----
function drawSkunk(e, x, y, bob) {
  const t = y + bob, step = Math.sin(timer * .18 + e.x) * 1.3;
  const flick = Math.sin(timer * .09 + e.x) * 2;

  // the tail, held high — the warning is the whole silhouette
  ctx.fillStyle = '#1c1a20';
  ctx.beginPath();
  ctx.moveTo(x + 15, t + 15);
  ctx.quadraticCurveTo(x + 26 + flick, t + 8, x + 20 + flick, t - 8);
  ctx.quadraticCurveTo(x + 17 + flick, t - 14, x + 12 + flick, t - 9);
  ctx.quadraticCurveTo(x + 18 + flick, t - 4, x + 13, t + 12);
  ctx.fill();
  ctx.fillStyle = '#f0ece0';                       // the white stripe up the tail
  ctx.beginPath();
  ctx.moveTo(x + 16, t + 12);
  ctx.quadraticCurveTo(x + 23 + flick, t + 6, x + 18 + flick, t - 6);
  ctx.quadraticCurveTo(x + 16 + flick, t - 10, x + 14 + flick, t - 7);
  ctx.quadraticCurveTo(x + 19 + flick, t - 2, x + 14, t + 11);
  ctx.fill();

  ctx.fillStyle = '#1c1a20';                       // body
  ctx.beginPath(); ctx.ellipse(x + 10, t + 14, 8.5, 5.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#f0ece0';                       // twin stripes along the back
  ctx.beginPath(); ctx.ellipse(x + 10, t + 10.5, 7, 2, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#1c1a20';
  ctx.fillRect(x + 9, t + 8.5, 2, 4);

  ctx.fillStyle = '#1c1a20';                       // legs
  ctx.fillRect(x + 6 + step, t + 18, 3, 3); ctx.fillRect(x + 12 - step, t + 18, 3, 3);

  ctx.fillStyle = '#1c1a20';                       // head
  ctx.beginPath(); ctx.ellipse(x + 3, t + 14, 4.5, 3.8, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#f0ece0';                       // blaze
  ctx.fillRect(x + 1, t + 10.5, 4, 4);
  ctx.fillStyle = '#e8dcc0';                       // snout
  ctx.beginPath(); ctx.moveTo(x - 2, t + 14); ctx.lineTo(x + 2, t + 12); ctx.lineTo(x + 2, t + 16); ctx.fill();
  ctx.fillStyle = '#1a1220'; ctx.fillRect(x - 1.5, t + 13.4, 1.6, 1.6);
  ctx.fillStyle = '#e0463c'; ctx.fillRect(x + 3, t + 13, 1.6, 1.6);
}

// ---- a wolverine: low, heavy, and coming at you ----
function drawWolverine(e, x, y, bob) {
  const t = y + bob, step = Math.sin(timer * .22 + e.x) * 1.8;
  const growl = Math.abs(Math.sin(timer * .12 + e.x));

  ctx.fillStyle = '#2e2118';                       // bushy tail
  ctx.beginPath(); ctx.ellipse(x + 22, t + 10, 5, 3.4, -.5, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = '#3a2a1c';                       // long low body
  ctx.beginPath(); ctx.ellipse(x + 13, t + 12, 10, 5.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#b08a4a';                       // the pale band along the flank
  ctx.beginPath();
  ctx.moveTo(x + 4, t + 10);
  ctx.quadraticCurveTo(x + 13, t + 5.5, x + 22, t + 10);
  ctx.quadraticCurveTo(x + 13, t + 8.5, x + 4, t + 12); ctx.fill();

  ctx.fillStyle = '#2e2118';                       // legs, planted wide
  ctx.fillRect(x + 6 + step, t + 15, 4, 5); ctx.fillRect(x + 15 - step, t + 15, 4, 5);
  ctx.fillStyle = '#d8d2c4';                       // claws
  for (let i = 0; i < 3; i++) {
    ctx.fillRect(x + 5.5 + step + i * 1.5, t + 19.5, 1, 2);
    ctx.fillRect(x + 14.5 - step + i * 1.5, t + 19.5, 1, 2);
  }

  ctx.fillStyle = '#3a2a1c';                       // broad head, held low
  ctx.beginPath(); ctx.ellipse(x + 4, t + 12, 5.5, 4.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#2e2118';                       // ears
  ctx.beginPath(); ctx.arc(x + 3, t + 8, 1.8, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(x + 7, t + 8, 1.8, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#b08a4a'; ctx.fillRect(x + 1, t + 9, 5, 1.6);   // mask stripe
  ctx.fillStyle = '#e0463c'; ctx.fillRect(x + 3, t + 11, 1.8, 1.8);
  ctx.fillStyle = '#1a1220';                       // snout
  ctx.beginPath(); ctx.ellipse(x - 1, t + 13, 2.4, 2, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#f0ece0';                       // bared teeth, on the growl
  ctx.beginPath();
  ctx.moveTo(x, t + 14.5); ctx.lineTo(x + 1.4, t + 16.5 + growl); ctx.lineTo(x + 2.4, t + 14.5);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x + 3, t + 14.5); ctx.lineTo(x + 4.2, t + 16.2 + growl); ctx.lineTo(x + 5.2, t + 14.5);
  ctx.fill();
}

// ---- a bull moose: no part of this is stompable ----
function drawMoose(e, x, y, bob) {
  const t = y + bob, step = Math.sin(timer * .14 + e.x) * 2;
  ctx.fillStyle = '#3a2a1e';
  ctx.fillRect(x + 6 + step, t + 14, 2.5, 7); ctx.fillRect(x + 14 - step, t + 14, 2.5, 7);
  ctx.fillStyle = '#4a3626';
  ctx.beginPath(); ctx.ellipse(x + 12, t + 11, 8, 5.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#5a4230';                        // shoulder hump
  ctx.beginPath(); ctx.ellipse(x + 9, t + 7, 5, 3.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#4a3626';
  ctx.fillRect(x + 3, t + 6, 5, 7);
  ctx.beginPath(); ctx.ellipse(x + 2, t + 10, 4, 2.8, .2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#2c1f16';
  ctx.beginPath(); ctx.ellipse(x - 1, t + 11, 1.8, 1.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#3a2a1e'; ctx.fillRect(x + 3, t + 12, 2, 4);      // dewlap
  ctx.fillStyle = '#e8e2d4'; ctx.fillRect(x + 4, t + 7, 1.5, 1.5);
  ctx.fillStyle = '#c9b08a';                        // palmate antlers
  [0, 1].forEach(side => {
    const ax = x + 6, ay = t + 4 + side;
    ctx.beginPath();
    ctx.moveTo(ax, ay); ctx.lineTo(ax + 6, ay - 5); ctx.lineTo(ax + 9, ay - 6);
    ctx.lineTo(ax + 9, ay - 3); ctx.lineTo(ax + 3, ay - 1); ctx.fill();
    for (let i = 0; i < 3; i++) ctx.fillRect(ax + 4 + i * 2.5, ay - 9 + i * .6, 1.6, 4);
  });
}

// ---- a sanglier: wild boar, tusks first ----
function drawBoar(e, x, y, bob) {
  const t = y + bob, step = Math.sin(timer * .2 + e.x) * 1.6;
  ctx.fillStyle = '#2c2420';
  ctx.fillRect(x + 6 + step, t + 16, 2.5, 5); ctx.fillRect(x + 13 - step, t + 16, 2.5, 5);
  ctx.fillStyle = '#3e332c';
  ctx.beginPath(); ctx.ellipse(x + 11, t + 12, 8.5, 6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#4e4038';
  ctx.beginPath(); ctx.ellipse(x + 6, t + 10, 5.5, 5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#6b5a4a';                        // bristle ridge
  for (let i = 0; i < 8; i++) {
    ctx.beginPath(); ctx.moveTo(x + 4 + i * 2, t + 6);
    ctx.lineTo(x + 5 + i * 2, t + 1 - Math.sin(i) * 1.5); ctx.lineTo(x + 6 + i * 2, t + 6); ctx.fill();
  }
  ctx.fillStyle = '#2c2420';
  ctx.beginPath(); ctx.moveTo(x + 6, t + 6); ctx.lineTo(x + 8, t + 2); ctx.lineTo(x + 10, t + 6); ctx.fill();
  ctx.fillStyle = '#4e4038';
  ctx.beginPath(); ctx.ellipse(x + 1, t + 12, 3, 2.4, .2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#1a1220'; ctx.fillRect(x, t + 11, 2, 2);
  ctx.fillStyle = '#e0463c'; ctx.fillRect(x + 5, t + 8, 1.6, 1.6);
  ctx.fillStyle = '#e8dcc0';                        // tusk
  ctx.beginPath(); ctx.moveTo(x + 1, t + 14); ctx.lineTo(x - 2, t + 9); ctx.lineTo(x + 1.5, t + 12); ctx.fill();
  ctx.fillStyle = '#3e332c'; ctx.fillRect(x + 19, t + 9, 2, 4);
}

// ---- a snowplough: wide, blade-first, absolutely not stompable ----
function drawPlow(e, x, y, bob) {
  const t = y + bob * .3, grind = Math.sin(timer * .4 + e.x) * .6;
  ctx.fillStyle = '#e0a23a';                        // cab and body
  ctx.fillRect(x + 8, t + 6, 14, 12);
  ctx.fillRect(x + 4, t + 12, 20, 7);
  ctx.fillStyle = '#b8801f'; ctx.fillRect(x + 4, t + 16, 20, 3);
  ctx.fillStyle = '#2a3550'; ctx.fillRect(x + 11, t + 8, 8, 6);      // cab glass
  ctx.fillStyle = '#c9ced8';                        // the blade, angled
  ctx.beginPath();
  ctx.moveTo(x + 4, t + 10); ctx.lineTo(x - 4, t + 20);
  ctx.lineTo(x + 3, t + 21); ctx.lineTo(x + 8, t + 12); ctx.fill();
  ctx.fillStyle = '#f4f8ff';                        // snow curling off it
  ctx.beginPath();
  ctx.moveTo(x - 4, t + 18); ctx.quadraticCurveTo(x - 12, t + 10 + grind, x - 16, t + 20);
  ctx.lineTo(x - 4, t + 21); ctx.fill();
  ctx.fillStyle = '#e04a3a';                        // beacon
  if (Math.floor(timer / 8) % 2) { ctx.fillRect(x + 13, t + 2, 5, 4); }
  else { ctx.fillStyle = '#7a2a24'; ctx.fillRect(x + 13, t + 2, 5, 4); }
  ctx.fillStyle = '#1a1620';                        // wheels
  ctx.beginPath(); ctx.arc(x + 9, t + 20, 4, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(x + 21, t + 20, 4, 0, Math.PI * 2); ctx.fill();
}

// ---- a skater doing laps of the rink, going nowhere in particular ----
function drawSkater(e, x, y, bob) {
  const t = y + bob, glide = Math.sin(timer * .11 + e.x);
  const coat = ['#c9224a', '#2f6f7a', '#6b5a8a', '#e0a23a'][Math.abs(Math.floor(e.x / 24)) % 4];
  ctx.fillStyle = '#2a2f3e';                        // legs, mid-stride
  ctx.fillRect(x + 7 + glide * 2, t + 15, 3.2, 6);
  ctx.fillRect(x + 11 - glide * 2, t + 15, 3.2, 6);
  ctx.fillStyle = '#c9ced8';                        // blades
  ctx.fillRect(x + 6 + glide * 2, t + 21, 6, 1.6);
  ctx.fillRect(x + 10 - glide * 2, t + 21, 6, 1.6);
  ctx.fillStyle = coat; ctx.fillRect(x + 5, t + 6, 11, 10);
  ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(x + 5, t + 6, 3, 10);
  ctx.fillStyle = coat;                             // arms out for balance
  ctx.fillRect(x + 1, t + 7 + glide * 2, 4, 3);
  ctx.fillRect(x + 16, t + 7 - glide * 2, 4, 3);
  ctx.fillStyle = '#d9b48a';
  ctx.beginPath(); ctx.arc(x + 10, t + 3, 4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#f0ece0';                        // woolly hat and scarf
  ctx.beginPath(); ctx.arc(x + 10, t + 2, 4.3, Math.PI, 0); ctx.fill();
  ctx.fillRect(x + 6, t + 1, 9, 2);
  ctx.beginPath(); ctx.arc(x + 10, t - 3, 1.7, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#c9224a';
  ctx.fillRect(x + 6, t + 6, 8, 2);
  ctx.fillRect(x + 12, t + 7, 2.4, 6 + glide);      // the tail of the scarf, flying
}

// ---- bystanders: in the way, never a threat ----

// a busker working the corner before the band gets there
function drawBusker(e, x, y, bob) {
  const t = y + bob, strum = Math.sin(timer * .3 + e.x) * 2;
  const sway = Math.sin(timer * .09 + e.x) * .8;

  // legs: narrow denim, not a warrior's stance
  ctx.fillStyle = '#2f3a52'; ctx.fillRect(x + 7, t + 15, 3, 6); ctx.fillRect(x + 10.6, t + 15, 3, 6);
  ctx.fillStyle = '#161320'; ctx.fillRect(x + 6, t + 20, 5, 2); ctx.fillRect(x + 10, t + 20, 5, 2);

  // slim buttoned coat with a scarf, shoulders narrower than the old jacket
  ctx.fillStyle = '#3f5d55'; ctx.fillRect(x + 6, t + 7, 9, 9);
  ctx.fillStyle = '#334a45'; ctx.fillRect(x + 6, t + 7, 2.5, 9);
  ctx.fillStyle = '#c4413c'; ctx.fillRect(x + 6, t + 6.5, 9, 2);          // scarf
  ctx.fillRect(x + 5 + sway, t + 8, 2, 4);                                // loose end

  // head: small, stubbled, under a flat cap with a brim
  ctx.fillStyle = '#d9b48a';
  ctx.beginPath(); ctx.arc(x + 10, t + 3.4, 3.4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#c19a72'; ctx.fillRect(x + 7, t + 4.6, 6, 1.6);        // stubble, not a beard
  ctx.fillStyle = '#1d222e'; ctx.fillRect(x + 6.4, t + 1.6, 7.4, 2);      // cap
  ctx.beginPath(); ctx.ellipse(x + 10, t + 1.4, 4.2, 2.2, 0, Math.PI, 0); ctx.fill();
  ctx.fillStyle = '#2b3340'; ctx.fillRect(x + 5.4, t + 3.2, 4, 1.2);      // brim, forward
  ctx.fillStyle = '#15161c'; ctx.fillRect(x + 8.6, t + 3.4, 1.2, 1.2);    // eye

  // acoustic: waisted body, sound hole, fretted neck running up past the head
  ctx.fillStyle = '#3a2a1e';
  ctx.fillRect(x + 14, t + 7.5, 11, 1.6);
  ctx.fillStyle = '#241a12'; ctx.fillRect(x + 24, t + 6.6, 2.6, 3.2);     // headstock
  ctx.fillStyle = '#c98a3a';
  ctx.beginPath(); ctx.ellipse(x + 10.5, t + 11, 4.6, 3.6, -.2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x + 13, t + 13.6, 5.4, 4.2, -.2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#e0a95c';                                              // lit top edge
  ctx.beginPath(); ctx.ellipse(x + 13, t + 12.6, 4.6, 1.4, -.2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#4a2f1c';
  ctx.beginPath(); ctx.arc(x + 13, t + 13.4, 1.7, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(243,230,210,.45)';                                // strings
  ctx.fillRect(x + 12, t + 9.4, 12, .6);
  ctx.fillStyle = '#d9b48a';                                              // strumming hand
  ctx.fillRect(x + 12 + strum * .4, t + 12, 2.6, 2.6);

  // open case, coins in it
  ctx.fillStyle = '#5c4326'; ctx.fillRect(x - 7, t + 17.5, 11, 4);
  ctx.fillStyle = '#c9a24a'; ctx.fillRect(x - 7, t + 17.5, 11, 1.4);
  ctx.fillStyle = '#ffce4a';
  ctx.fillRect(x - 5, t + 19, 1.6, 1.4); ctx.fillRect(x - 2.4, t + 19, 1.6, 1.4);
}

// a civil servant crossing the canal, briefcase first
