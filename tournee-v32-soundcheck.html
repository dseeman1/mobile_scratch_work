}

// ---- a concert-goer: queueing, filming, wearing last night's shirt ----
function drawFan(e, x, y, bob) {
  const t = y + bob;
  const seed = Math.abs(Math.floor(e.x / 24));
  const tee = ['#17151b', '#2a1f3a', '#3a1f24', '#1f2a3a', '#2a2a1f'][seed % 5];
  const jeans = ['#2f3b52', '#3a3340', '#2a3a3a'][seed % 3];
  // every so often they stop and hold a phone up, and become a wall
  const filming = ((Math.floor(timer / 70) + seed) % 3) === 0;
  const stride = filming ? 0 : Math.sin(timer * .16 + e.x) * 1.6;

  ctx.fillStyle = jeans;                            // legs
  ctx.fillRect(x + 6 + stride, t + 15, 3.4, 6);
  ctx.fillRect(x + 10 - stride, t + 15, 3.4, 6);
  ctx.fillStyle = '#e8e2d4';
  ctx.fillRect(x + 5 + stride, t + 20, 5, 2);
  ctx.fillRect(x + 10 - stride, t + 20, 5, 2);

  ctx.fillStyle = tee;                              // band shirt
  ctx.fillRect(x + 4, t + 6, 11, 9);
  ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.fillRect(x + 4, t + 6, 3, 9);
  ctx.fillStyle = POIS.cream;                       // a polka-dot print on the shirt
  [[7, 9], [11, 8], [9, 12], [12, 11]].forEach(d => {
    ctx.beginPath(); ctx.arc(x + d[0], t + d[1], .9, 0, Math.PI * 2); ctx.fill();
  });
  ctx.fillStyle = POIS.gold;
  ctx.beginPath();
  ctx.moveTo(x + 9.5, t + 8.5); ctx.lineTo(x + 11, t + 11); ctx.lineTo(x + 8, t + 11); ctx.fill();

  ctx.fillStyle = '#c9a24a';                        // lanyard
  ctx.fillRect(x + 6, t + 6, 1.2, 4); ctx.fillRect(x + 12, t + 6, 1.2, 4);
  ctx.fillStyle = '#e8e2d4'; ctx.fillRect(x + 8, t + 10, 4, 3);

  ctx.fillStyle = '#4a3a2e';                        // tote bag
  ctx.fillRect(x + 14, t + 9, 4, 6);

  ctx.fillStyle = '#d9b48a';                        // head
  ctx.beginPath(); ctx.arc(x + 9, t + 3, 4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = ['#2a1f1a', '#5a3a24', '#3a2a3a', '#c9a24a'][seed % 4];
  ctx.beginPath(); ctx.arc(x + 9, t + 2, 4.1, Math.PI, 0); ctx.fill();
  ctx.fillRect(x + 5, t + 1, 8, 2);

  if (filming) {                                    // phone up, elbows out
    ctx.fillStyle = '#d9b48a';
    ctx.fillRect(x + 3, t + 3, 3, 4); ctx.fillRect(x + 13, t + 3, 3, 4);
    ctx.fillStyle = '#1a1820'; ctx.fillRect(x + 7, t - 3, 5, 8);
    ctx.fillStyle = 'rgba(190,220,255,.75)'; ctx.fillRect(x + 7.8, t - 2.2, 3.4, 6);
  } else {
    ctx.fillStyle = '#d9b48a';
    ctx.fillRect(x + 2, t + 8 + stride, 3, 6);
    ctx.fillRect(x + 14, t + 8 - stride, 3, 6);
  }
}

// ---- a Habs fan: jersey, beer, eyes on the screen not on you ----
function drawHockeyFan(e, x, y, bob) {
  const C = RECRUE, t = y + bob;
  const seed = Math.abs(Math.floor(e.x / 24));
  // they surge when something happens in the game
  const roar = ((Math.floor(timer / 90) + seed) % 4) === 0;
  const lift = roar ? Math.abs(Math.sin(timer * .3)) * 3 : 0;
  const stride = roar ? 0 : Math.sin(timer * .15 + e.x) * 1.4;

  ctx.fillStyle = '#2a2f3e';                        // jeans
  ctx.fillRect(x + 6 + stride, t + 15, 3.4, 6);
  ctx.fillRect(x + 10 - stride, t + 15, 3.4, 6);
  ctx.fillStyle = '#1a1620';
  ctx.fillRect(x + 5 + stride, t + 20, 5, 2);
  ctx.fillRect(x + 10 - stride, t + 20, 5, 2);

  ctx.fillStyle = C.red;      ctx.fillRect(x + 3, t + 6 - lift * .3, 13, 9);   // the sweater
  ctx.fillStyle = C.redDark;  ctx.fillRect(x + 3, t + 6 - lift * .3, 3, 9);
  ctx.fillStyle = C.white;    ctx.fillRect(x + 3, t + 9 - lift * .3, 13, 3.4);
  ctx.fillStyle = C.blue;     ctx.fillRect(x + 3, t + 10 - lift * .3, 13, 1.8);
  ctx.fillStyle = C.white;    ctx.fillRect(x + 3, t + 14 - lift * .3, 13, 1.2);

  ctx.fillStyle = '#d9b48a';                        // head
  ctx.beginPath(); ctx.arc(x + 9, t + 3 - lift * .4, 4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = C.blue;                           // toque in club colours
  ctx.fillRect(x + 5, t - lift * .4, 8, 3);
  ctx.fillStyle = C.red; ctx.fillRect(x + 5, t + 1 - lift * .4, 8, 1.4);
  ctx.fillStyle = C.white;
  ctx.beginPath(); ctx.arc(x + 9, t - 2 - lift * .4, 1.6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#1a1220'; ctx.fillRect(x + 10, t + 2 - lift * .4, 1.6, 1.6);

  if (roar) {                                       // both arms up
    ctx.fillStyle = C.red;
    ctx.fillRect(x + 1, t + 1 - lift, 3, 7); ctx.fillRect(x + 15, t + 1 - lift, 3, 7);
    ctx.fillStyle = '#d9b48a';
    ctx.fillRect(x + 1, t - 2 - lift, 3, 3); ctx.fillRect(x + 15, t - 2 - lift, 3, 3);
  } else {
    ctx.fillStyle = C.red;
    ctx.fillRect(x + 1, t + 8 + stride, 3, 6);
    ctx.fillRect(x + 15, t + 8 - stride, 3, 6);
    ctx.fillStyle = '#c9a24a';                      // a pint, held level
    ctx.fillRect(x + 15, t + 6 - stride, 4, 5);
    ctx.fillStyle = '#f3e6d2'; ctx.fillRect(x + 15, t + 5.4 - stride, 4, 1.4);
  }
}

// ---- a goaltender: pads, blocker, mask. Nothing gets through by stomping. ----
function drawGoalie(e, x, y, bob) {
  const C = RECRUE, t = y + bob * .4;
  const shuffle = Math.sin(timer * .1 + e.x) * 1.2;

  ctx.fillStyle = '#e8e2d4';                        // leg pads, wide
  ctx.fillRect(x + 4 + shuffle, t + 10, 8, 13);
  ctx.fillRect(x + 14 - shuffle, t + 10, 8, 13);
  ctx.fillStyle = C.red;
  ctx.fillRect(x + 4 + shuffle, t + 14, 8, 2.4); ctx.fillRect(x + 14 - shuffle, t + 14, 8, 2.4);
  ctx.fillStyle = C.blue;
  ctx.fillRect(x + 4 + shuffle, t + 19, 8, 2.4); ctx.fillRect(x + 14 - shuffle, t + 19, 8, 2.4);

  ctx.fillStyle = C.red;    ctx.fillRect(x + 5, t + 3, 15, 9);      // chest
  ctx.fillStyle = C.white;  ctx.fillRect(x + 5, t + 6, 15, 3);
  ctx.fillStyle = C.blue;   ctx.fillRect(x + 5, t + 7, 15, 1.6);

  ctx.fillStyle = '#e8e2d4';                        // blocker
  ctx.fillRect(x + 20, t + 5, 6, 9);
  ctx.fillStyle = '#c9ced8';                        // trapper
  ctx.beginPath(); ctx.arc(x + 2, t + 10, 5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#8a5a32';                        // the stick, paddle down
  ctx.fillRect(x - 2, t + 18, 26, 2.4);
  ctx.fillRect(x + 21, t + 8, 2.4, 11);

  ctx.fillStyle = '#e8e2d4';                        // mask
  ctx.beginPath(); ctx.arc(x + 12, t, 5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = C.red;
  ctx.beginPath(); ctx.arc(x + 12, t - 1, 5, Math.PI, 0); ctx.fill();
  ctx.fillStyle = '#3a3f4a';                        // cage
  for (let i = 0; i < 3; i++) ctx.fillRect(x + 8, t + i * 1.8, 8, .9);
  ctx.fillRect(x + 12, t - 1, .9, 5);
}

// ---- a reveller: dancing, drink aloft, not looking where you are ----
function drawReveller(e, x, y, bob) {
  const t = y + bob, sway = Math.sin(timer * .13 + e.x) * 2;
  const shirt = ['#ff6fae', '#7fe0c0', '#ffce4a', '#8a7fe0'][Math.floor(Math.abs(e.x / 24)) % 4];
  ctx.fillStyle = '#1c1a26';                        // legs
  ctx.fillRect(x + 6 + sway * .4, t + 14, 3.4, 7);
  ctx.fillRect(x + 11 - sway * .4, t + 14, 3.4, 7);
  ctx.fillStyle = shirt;                            // torso, swaying
  ctx.save(); ctx.translate(x + 10, t + 14); ctx.rotate(sway * .045); ctx.translate(-(x + 10), -(t + 14));
  ctx.fillRect(x + 5, t + 6, 10, 9);
  ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(x + 5, t + 6, 3, 9);
  ctx.fillStyle = shirt;                            // one arm up
  ctx.fillRect(x + 14, t + 1, 2.6, 7);
  ctx.fillRect(x + 3, t + 8, 2.6, 6);
  ctx.fillStyle = '#d9b48a';
  ctx.fillRect(x + 14, t - 1, 2.6, 2.6);
  ctx.fillStyle = 'rgba(255,214,140,.85)';          // the drink
  ctx.fillRect(x + 13.4, t - 5, 4, 4);
  ctx.fillStyle = '#d9b48a';                        // head
  ctx.beginPath(); ctx.arc(x + 10, t + 3, 3.8, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#2a1f2a';
  ctx.beginPath(); ctx.arc(x + 10, t + 1.5, 3.8, Math.PI, 0); ctx.fill();
  ctx.restore();
}

// ---- an amp stack: on castors, corners out, absolutely not stompable ----
function drawAmp(e, x, y, bob) {
  const t = y + bob * .3, hum = Math.abs(Math.sin(timer * .22 + e.x)) * 1.2;
  ctx.fillStyle = '#14121a';                        // cabinet
  ctx.fillRect(x + 2, t + 3, 18, 15);
  ctx.fillStyle = '#22202c'; ctx.fillRect(x + 2, t + 3, 18, 3);
  ctx.fillStyle = '#2e2a38';                        // grille cloth
  ctx.fillRect(x + 4, t + 7, 14, 9);
  ctx.fillStyle = '#3c3748';
  for (let i = 0; i < 5; i++) ctx.fillRect(x + 4, t + 7 + i * 2, 14, 1);
  ctx.fillStyle = '#191722';                        // the cones, pulsing
  [6, 14].forEach(cx => {
    ctx.beginPath(); ctx.arc(x + cx, t + 11.5, 3.4 + hum * .3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#4a4458';
    ctx.beginPath(); ctx.arc(x + cx, t + 11.5, 1.3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#191722';
  });
  ctx.fillStyle = '#c9b06a';                        // metal corner caps
  [[1, 2], [19, 2], [1, 16], [19, 16]].forEach(c => ctx.fillRect(x + c[0], t + c[1], 3, 3));
  ctx.fillStyle = '#ff6fae';                        // power lamp
  ctx.fillRect(x + 17, t + 4.6, 1.6, 1.6);
  ctx.fillStyle = '#0e0d14';                        // castors
  ctx.beginPath(); ctx.arc(x + 5, t + 19, 2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(x + 17, t + 19, 2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,111,174,' + (.10 + hum * .07).toFixed(2) + ')';
  ctx.fillRect(x - 2, t + 5, 26, 12);               // the wall of sound
}

// ---- a Canada goose: territorial, waddles, honks at you ----
function drawGoose(e, x, y, bob) {
  const waddle = Math.sin(timer * .18 + e.x) * 1.6;
  const t = y + bob;

  ctx.fillStyle = '#e08a3c';                       // legs, alternating stride
  ctx.fillRect(x + 6 + waddle, t + 16, 2, 4);
  ctx.fillRect(x + 11 - waddle, t + 16, 2, 4);
  ctx.fillRect(x + 5 + waddle, t + 19, 5, 2);
  ctx.fillRect(x + 10 - waddle, t + 19, 5, 2);

  ctx.fillStyle = '#7d6247';                       // body
  ctx.beginPath(); ctx.ellipse(x + 10, t + 12, 8, 5.5, 0, 0, Math.PI * 2); ctx.fill();
  // Every ~5s, offset per bird so a flock never flaps in unison, the wing
  // opens for about half a second and the body lifts a hair with it.
  const cyc = (timer + Math.floor(e.x * 7)) % 300;
  const flap = cyc < 34 ? Math.sin(cyc / 34 * Math.PI * 3) : 0;
  const lift = Math.abs(flap) * 1.6;
  ctx.fillStyle = '#9c7d5e';                       // wing: folded, or beating
  if (flap) {
    ctx.save();
    ctx.translate(x + 12, t + 10 - lift); ctx.rotate(-.55 * flap - .1);
    ctx.beginPath(); ctx.ellipse(1, 0, 7.5, 3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#b9987a';                     // lit upper surface of the wing
    ctx.beginPath(); ctx.ellipse(1, -1, 6.5, 1.6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  } else {
    ctx.beginPath(); ctx.ellipse(x + 11, t + 11, 5.5, 3.5, -.2, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = '#f3e6d2'; ctx.fillRect(x + 15, t + 13, 4, 3);   // tail flash

  ctx.fillStyle = '#14161c';                       // the black neck
  ctx.fillRect(x + 3, t + 3, 4, 10);
  ctx.beginPath(); ctx.ellipse(x + 3, t + 3, 4, 3.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#f3e6d2';                       // the white chinstrap
  ctx.fillRect(x + 1, t + 3, 3, 3);
  ctx.fillStyle = '#14161c';
  ctx.beginPath(); ctx.moveTo(x - 1, t + 2);       // bill
  ctx.lineTo(x - 5, t + 3); ctx.lineTo(x - 1, t + 5); ctx.fill();
  ctx.fillStyle = '#e8e2d4'; ctx.fillRect(x + 3, t + 1, 1.5, 1.5);  // eye
}

// ---- a porcupine: all quills, so stomping it is a bad idea ----
function drawPorcupine(e, x, y, bob) {
  const bristle = 1 + Math.abs(Math.sin(timer * .1 + e.x)) * 1.6;
  const t = y + bob;

  ctx.fillStyle = '#e8dcc0';                       // the quill mass, fanned out
  for (let i = 0; i < 9; i++) {
    const qx = x + 4 + i * 1.9, lean = (i - 4) * .55;
    ctx.beginPath();
    ctx.moveTo(qx - 1.6, t + 12);
    ctx.lineTo(qx + lean, t + 2 - bristle - Math.sin(i * .8) * 2);
    ctx.lineTo(qx + 1.6, t + 12);
    ctx.fill();
  }
  ctx.fillStyle = '#4a3524';                       // quill tips, darker
  for (let i = 0; i < 9; i++) {
    const qx = x + 4 + i * 1.9, lean = (i - 4) * .55;
    ctx.fillRect(qx + lean - .8, t + 2 - bristle - Math.sin(i * .8) * 2, 1.6, 3);
  }

  ctx.fillStyle = '#5c4632';                       // body
  ctx.beginPath(); ctx.ellipse(x + 11, t + 14, 9, 6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#6e5540';
  ctx.beginPath(); ctx.ellipse(x + 5, t + 14, 4.5, 4, 0, 0, Math.PI * 2); ctx.fill();  // snout end

  ctx.fillStyle = '#3a2a1c';                       // face
  ctx.beginPath(); ctx.moveTo(x + 1, t + 14);
  ctx.lineTo(x + 5, t + 12); ctx.lineTo(x + 5, t + 16); ctx.fill();
  ctx.fillStyle = '#e0463c'; ctx.fillRect(x + 5, t + 12, 2, 2);      // eye
  ctx.fillStyle = '#1a1220'; ctx.fillRect(x, t + 13, 2, 2);          // nose

  ctx.fillStyle = '#3a2a1c';                       // feet
  ctx.fillRect(x + 6, t + 18, 3, 2); ctx.fillRect(x + 13, t + 18, 3, 2);
}

const SPECIES = {
  goose: drawGoose, beaver: drawBeaver, raccoon: drawRaccoon, pigeon: drawPigeon,
  reveller: drawReveller, fan: drawFan,
  busker: drawBusker, millhand: drawMillHand, sketcher: drawSketcher, suit: drawSuit,
  skater: drawSkater, plow: drawPlow,
  hockeyfan: drawHockeyFan, goalie: drawGoalie,
  porcupine: drawPorcupine, skunk: drawSkunk, wolverine: drawWolverine,
  moose: drawMoose, boar: drawBoar,
  amp: drawAmp
};

function drawEnemies() {
  const W = VW, H = VH;   // viewport, not canvas
  for (const e of enemies) {
    const x = e.x - cam, y = e.y - camY;
    if (x < -50 || x > W + 50) continue;
    if (!e.alive) {
      if (e.squash > 0) {
        ctx.fillStyle = e.armored ? '#6e5540' : '#7d6247';
        ctx.fillRect(x, y + e.h - 6, e.w, 6);
        ctx.fillStyle = e.armored ? '#e8dcc0' : '#f3e6d2';
        ctx.fillRect(x + 2, y + e.h - 8, e.w - 4, 2);
        ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.fillRect(x, y + e.h - 2, e.w, 2);
      }
      continue;
    }
    const bob = Math.sin(timer * .15 + e.x) * 1.4;
    const shake = e.riled > 0 ? Math.sin(timer * .9 + e.x) * 1.2
                : e.jostle > 0 ? Math.sin(timer * 1.1 + e.x) * (e.jostle / 14) : 0;
    critter(e, x + shake, y, () => (SPECIES[e.kind] || drawGoose)(e, x + shake, y, bob));
    if (e.jostle > 0) {                                       // a startled squiggle
      ctx.fillStyle = 'rgba(243,230,210,.7)';
      ctx.fillRect(x + e.w / 2 - 1, y - 8, 2, 4);
      ctx.fillRect(x + e.w / 2 - 1, y - 3, 2, 2);
    }
    if (e.riled > 0 && Math.floor(timer / 6) % 2) {          // anger marks
      ctx.fillStyle = '#ff5a4a';
      ctx.fillRect(x + e.w / 2 - 5, y - 7, 2, 5);
      ctx.fillRect(x + e.w / 2 + 3, y - 7, 2, 5);
    }
  }
}

function drawFlag() {
  const W = VW, H = VH;   // viewport, not canvas
  if (!flag) return;
  const x = flag.x - cam, y = flag.y - camY;
  ctx.fillStyle = '#f3e6d2'; ctx.fillRect(x, y, flag.w, flag.h);
  const flap = Math.sin(timer * .12) * 3;
  ctx.fillStyle = (!inSoundcheck && levelIndex === 5) ? '#3b5bdb' : '#e0463c';
  ctx.beginPath();
  ctx.moveTo(x + flag.w, y + 4); ctx.lineTo(x + flag.w + 24 + flap, y + 13);
  ctx.lineTo(x + flag.w, y + 22); ctx.fill();
}

// ---- the hero: a voyageur in a red toque and a ceinture fléchée ----
const HERO = {
  toque:'#d13b34', toqueDark:'#a52c26', pom:'#f3e6d2',
  skin:'#e8b78d', skinDark:'#c9946c', beard:'#8a5a3a',
  coat:'#3e6b52', coatDark:'#2c4d3b', coatLight:'#4d8464',
  sash:'#e0463c', sashAlt:'#ffce4a',
  pack:'#8a6236', boot:'#4a3524'
};

function drawHero(p, x, y) {
  const f = p.face, C = HERO;
  const run = p.onGround && Math.abs(p.vx) > .3;
  const swing = Math.sin(p.step) * 3.4;
  const bob = run ? Math.abs(Math.sin(p.step)) * 1.2 : 0;
  const t = y + bob;

  // flip around the sprite's own centre so it faces the way it moves
  ctx.save();
  if (f < 0) { ctx.translate(x + p.w / 2, 0); ctx.scale(-1, 1); ctx.translate(-(x + p.w / 2), 0); }

  ctx.fillStyle = 'rgba(0,0,0,.28)';
  ctx.fillRect(x + 1, y + p.h - 2, p.w - 2, 3);

  // canvas pack on the back
  ctx.fillStyle = C.pack; ctx.fillRect(x - 3, t + 9, 5, 9);
  ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.fillRect(x - 3, t + 12, 5, 2);

  // back leg
  ctx.fillStyle = C.coatDark;
  ctx.fillRect(x + 3 - (run ? swing : 0), t + 16, 5, 5);
  ctx.fillStyle = C.boot;
  ctx.fillRect(x + 2 - (run ? swing : 0), t + 20, 7, 2);

  // front leg
  ctx.fillStyle = C.coat;
  ctx.fillRect(x + 8 + (run ? swing : 0), t + 16, 5, 5);
  ctx.fillStyle = C.boot;
  ctx.fillRect(x + 8 + (run ? swing : 0), t + 20, 7, 2);

  // wool coat
  ctx.fillStyle = C.coat;    ctx.fillRect(x + 2, t + 8, 12, 9);
  ctx.fillStyle = C.coatLight; ctx.fillRect(x + 2, t + 8, 12, 2);
  ctx.fillStyle = C.coatDark;  ctx.fillRect(x + 2, t + 8, 3, 9);

  // ceinture fléchée — the arrow sash, in red and gold
  ctx.fillStyle = C.sash;    ctx.fillRect(x + 2, t + 13, 12, 3);
  ctx.fillStyle = C.sashAlt;
  for (let i = 0; i < 4; i++) ctx.fillRect(x + 3 + i * 3, t + 13, 1, 3);
  ctx.fillStyle = C.sash;    ctx.fillRect(x + 12, t + 16, 2, 4);   // sash tail

  // arms
  ctx.fillStyle = C.coatDark;
  if (!p.onGround) {
    ctx.fillRect(x + 12, t + 6, 4, 7);                 // raised, mid-leap
    ctx.fillRect(x, t + 10, 3, 6);
  } else {
    ctx.fillRect(x + 12, t + 9 + (run ? -swing : 0), 4, 7);
    ctx.fillRect(x + 1, t + 9 + (run ? swing : 0), 3, 6);
  }
  ctx.fillStyle = C.skinDark;
  ctx.fillRect(x + 13, t + (p.onGround ? 15 : 12) + (run ? -swing : 0), 3, 3);

  // head, beard, face
  ctx.fillStyle = C.skin;   ctx.fillRect(x + 3, t + 1, 10, 8);
  ctx.fillStyle = C.beard;  ctx.fillRect(x + 3, t + 6, 10, 3);
  ctx.fillRect(x + 3, t + 4, 2, 4);
  ctx.fillStyle = '#1a1220'; ctx.fillRect(x + 9, t + 4, 2, 2);      // eye
  ctx.fillStyle = C.skinDark; ctx.fillRect(x + 12, t + 4, 2, 2);    // nose

  // toque with a rolled brim and a pompom
  ctx.fillStyle = C.toque;     ctx.fillRect(x + 2, t - 3, 12, 5);
  ctx.fillStyle = C.toqueDark; ctx.fillRect(x + 2, t - 1, 12, 2);
  ctx.fillStyle = C.toque;     ctx.fillRect(x + 3, t - 5, 9, 2);
  ctx.fillStyle = C.pom;
  ctx.beginPath(); ctx.arc(x + 7, t - 6, 2.4, 0, Math.PI * 2); ctx.fill();

  ctx.restore();
}

// ---- Angine de Poitrine ----
// The costumes invert each other: Khn wears a white dotted headpiece over a
// black dotted suit, Klek a black dotted head over a white dotted robe. Gold
// triangles on both.
const POIS = {
  cream:'#f2ece0', creamShade:'#d8d1c2',
  ink:'#17151b',   inkShade:'#26232c',
  gold:'#d9a527',  goldLt:'#f0c452',
  face:'#e8e2d6',  fringe:'#e0a72e', fringeDk:'#b8821c'
};

// deterministic spots, so the suit doesn't crawl between frames
function dots(x, y, w, h, colour, seed, n, r) {
  ctx.fillStyle = colour;
  for (let i = 0; i < (n || 10); i++) {
    const dx = (i * 7 + seed * 5) % w, dy = (i * 5 + seed * 3) % h;
    ctx.beginPath(); ctx.arc(x + dx, y + dy, r || 1.3, 0, Math.PI * 2); ctx.fill();
  }
}

const goldTri = (cx, cy, w, h) => {
  ctx.fillStyle = POIS.gold;
  ctx.beginPath();
  ctx.moveTo(cx, cy - h); ctx.lineTo(cx + w, cy + h); ctx.lineTo(cx - w, cy + h);
  ctx.fill();
};

// ---- Khn: white inverted-trapezoid headpiece, gold fringe, double-neck ----
function drawKhn(p, x, y) {
  const run = p.onGround && Math.abs(p.vx) > .3;
  const swing = Math.sin(p.step) * 3.2, t = y + (run ? Math.abs(Math.sin(p.step)) * 1.1 : 0);
  ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.fillRect(x + 1, y + p.h - 2, p.w - 2, 3);

  // black suit, white spots
  ctx.fillStyle = POIS.ink;
  ctx.fillRect(x + 3 - (run ? swing : 0), t + 16, 5, 6);
  ctx.fillRect(x + 8 + (run ? swing : 0), t + 16, 5, 6);
  dots(x + 3 - (run ? swing : 0), t + 17, 5, 5, POIS.cream, 2, 3, 1);
  dots(x + 8 + (run ? swing : 0), t + 17, 5, 5, POIS.cream, 5, 3, 1);
  ctx.fillStyle = POIS.cream;                            // white gloves/boots
  ctx.fillRect(x + 2 - (run ? swing : 0), t + 21, 7, 2);
  ctx.fillRect(x + 8 + (run ? swing : 0), t + 21, 7, 2);

  ctx.fillStyle = POIS.ink; ctx.fillRect(x + 2, t + 8, 13, 9);
  ctx.fillStyle = POIS.inkShade; ctx.fillRect(x + 2, t + 8, 3, 9);
  dots(x + 3, t + 9, 12, 8, POIS.cream, 1, 9, 1.3);

  // the double-neck, held across the body
  const lift = run ? -swing * .4 : 0;
  ctx.fillStyle = POIS.cream;
  ctx.beginPath(); ctx.ellipse(x + 7, t + 14 + lift, 6, 4, -.12, 0, Math.PI * 2); ctx.fill();
  dots(x + 3, t + 12 + lift, 8, 5, POIS.ink, 3, 5, 1);
  ctx.fillStyle = POIS.ink;
  ctx.fillRect(x + 12, t + 10 + lift, 12, 2);            // upper neck
  ctx.fillRect(x + 12, t + 14 + lift, 12, 2);            // lower neck
  ctx.fillStyle = POIS.goldLt;
  for (let i = 0; i < 7; i++) {                          // quarter-tone frets
    ctx.fillRect(x + 14 + i * 1.4, t + 10 + lift, .6, 2);
    ctx.fillRect(x + 14 + i * 1.4, t + 14 + lift, .6, 2);
  }
  ctx.fillStyle = POIS.cream;
  ctx.fillRect(x + 11, t + 11 + lift, 3, 3);
  ctx.fillRect(x + 16, t + 13 + lift, 3, 3);

  // the headpiece: wide at the top, narrowing to the face
  ctx.fillStyle = POIS.cream;
  ctx.beginPath();
  ctx.moveTo(x - 2, t - 13); ctx.lineTo(x + 18, t - 13);
  ctx.lineTo(x + 11, t + 1); ctx.lineTo(x + 5, t + 1);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = POIS.creamShade;                        // shaded side
  ctx.beginPath();
  ctx.moveTo(x - 2, t - 13); ctx.lineTo(x + 3, t - 13);
  ctx.lineTo(x + 6, t + 1); ctx.lineTo(x + 5, t + 1);
  ctx.closePath(); ctx.fill();
  dots(x, t - 12, 15, 12, POIS.ink, 4, 11, 1.25);
  goldTri(x + 8, t - 7, 4, 3.4);

  // the small pale face, and the gold fringe hanging either side
  ctx.fillStyle = POIS.face;
  ctx.beginPath(); ctx.ellipse(x + 8, t + 2, 4.4, 3.2, 0, 0, Math.PI * 2); ctx.fill();
  dots(x + 5, t + 1, 6, 3, POIS.ink, 7, 3, .9);
  ctx.fillStyle = POIS.ink; ctx.fillRect(x + 9, t + 2, 2.4, 1.4);
  ctx.fillStyle = POIS.gold;
  ctx.beginPath(); ctx.moveTo(x + 7, t + 4); ctx.lineTo(x + 9, t + 6); ctx.lineTo(x + 11, t + 4); ctx.fill();
  for (let i = 0; i < 6; i++) {                           // fringe strands
    const fx = x + 1 + i * 2.6, len = 7 + Math.sin(i * 1.4 + timer * .05) * 1.6;
    ctx.fillStyle = i % 2 ? POIS.fringe : POIS.fringeDk;
    ctx.fillRect(fx, t + 3, 1.6, len);
  }
}

// ---- Klek: black dome head with a gold tip, white dotted robe ----
function drawKlek(p, x, y) {
  const run = p.onGround && Math.abs(p.vx) > .3;
  const swing = Math.sin(p.step) * 3.2, t = y + (run ? Math.abs(Math.sin(p.step)) * 1.1 : 0);
  const beat = Math.sin(timer * .34), beat2 = Math.sin(timer * .34 + 2.1);
  ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.fillRect(x + 1, y + p.h - 2, p.w - 2, 3);

  ctx.fillStyle = POIS.ink;                               // dark legs under the robe
  ctx.fillRect(x + 4 - (run ? swing : 0), t + 17, 4, 5);
  ctx.fillRect(x + 9 + (run ? swing : 0), t + 17, 4, 5);

  // the white robe, flaring out at the hem
  ctx.fillStyle = POIS.cream;
  ctx.beginPath();
  ctx.moveTo(x + 2, t + 6); ctx.lineTo(x + 14, t + 6);
  ctx.lineTo(x + 17, t + 19); ctx.lineTo(x - 1, t + 19);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = POIS.creamShade;
  ctx.beginPath();
  ctx.moveTo(x + 2, t + 6); ctx.lineTo(x + 5, t + 6);
  ctx.lineTo(x + 3, t + 19); ctx.lineTo(x - 1, t + 19);
  ctx.closePath(); ctx.fill();
  dots(x, t + 7, 16, 12, POIS.ink, 6, 12, 1.35);
  goldTri(x + 8, t + 12, 3.6, 3);

  ctx.fillStyle = POIS.ink;                               // black gloves
  ctx.fillRect(x + 13, t + 11, 3.4, 3.4);
  ctx.fillRect(x + 1, t + 12, 3.4, 3.4);

  ctx.fillStyle = POIS.cream;                             // snare at the hip
  ctx.fillRect(x + 14, t + 14, 6, 5);
  ctx.fillStyle = POIS.ink;
  ctx.fillRect(x + 14, t + 14, 6, 1.2); ctx.fillRect(x + 14, t + 17.8, 6, 1.2);

  ctx.fillStyle = POIS.ink;                               // sticks, out of phase
  ctx.save(); ctx.translate(x + 15, t + 12); ctx.rotate(-.5 + beat * .5);
  ctx.fillRect(0, -1, 9, 1.7); ctx.restore();
  ctx.save(); ctx.translate(x + 14, t + 14); ctx.rotate(-.15 + beat2 * .5);
  ctx.fillRect(0, -1, 8, 1.7); ctx.restore();

  // the head: a tall black dome, gold point on top
  ctx.fillStyle = POIS.ink;
  ctx.beginPath();
  ctx.moveTo(x + 2, t + 6);
  ctx.lineTo(x + 2, t - 6);
  ctx.quadraticCurveTo(x + 8, t - 14, x + 14, t - 6);
  ctx.lineTo(x + 14, t + 6);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = POIS.inkShade;
  ctx.beginPath();
  ctx.moveTo(x + 2, t + 6); ctx.lineTo(x + 2, t - 6);
  ctx.quadraticCurveTo(x + 5, t - 12, x + 6, t - 11);
  ctx.lineTo(x + 6, t + 6); ctx.closePath(); ctx.fill();
  dots(x + 3, t - 10, 11, 15, POIS.cream, 8, 12, 1.25);

  ctx.fillStyle = POIS.gold;                              // the gold tip
  ctx.beginPath();
  ctx.moveTo(x + 8, t - 17); ctx.lineTo(x + 11, t - 12); ctx.lineTo(x + 5, t - 12);
  ctx.fill();
  ctx.fillStyle = POIS.goldLt;                            // diamond eyes
  [[5.5, -5], [10.5, -5]].forEach(d => {
    ctx.beginPath();
    ctx.moveTo(x + d[0], t + d[1] - 2.2); ctx.lineTo(x + d[0] + 2.2, t + d[1]);
    ctx.lineTo(x + d[0], t + d[1] + 2.2); ctx.lineTo(x + d[0] - 2.2, t + d[1]);
    ctx.fill();
  });
  ctx.fillStyle = POIS.gold;                              // the gold mouth bar
  ctx.fillRect(x + 4, t + 2.5, 8, 2.2);
  ctx.fillStyle = POIS.inkShade; ctx.fillRect(x + 5, t + 3, 6, .8);
}

// ---- La Recrue: the rookie, in bleu-blanc-rouge ----
// Club colours only — no crest, since that mark isn't mine to reproduce.
const RECRUE = {
  red:'#af1e2d', redDark:'#8a1522', blue:'#1c2a6b', blueDark:'#141e4e',
  white:'#f2ece0', whiteShade:'#d5cfc2',
  skin:'#e8b78d', skinDark:'#c9946c', hair:'#3a2a1e',
  stick:'#a8763c', tape:'#17151b', blade:'#c9ced8'
};

function drawRecrue(p, x, y) {
  const C = RECRUE, run = p.onGround && Math.abs(p.vx) > .3;
  const swing = Math.sin(p.step) * 3.4;
  const t = y + (run ? Math.abs(Math.sin(p.step)) * 1.1 : 0);

  ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.fillRect(x + 1, y + p.h - 2, p.w - 2, 3);

  // back leg, then front — dark socks with the club's stripe
  const legs = [[3, -1], [8, 1]];
  legs.forEach(([lx, dir], i) => {
    const off = run ? swing * dir : 0;
    ctx.fillStyle = i ? C.blue : C.blueDark;
    ctx.fillRect(x + lx + off, t + 15, 5, 6);
    ctx.fillStyle = C.white; ctx.fillRect(x + lx + off, t + 17, 5, 1.6);
    ctx.fillStyle = C.red;   ctx.fillRect(x + lx + off, t + 19, 5, 1.4);
    ctx.fillStyle = C.blade;                                  // skate blade
    ctx.fillRect(x + lx - 1 + off, t + 21, 7, 1.6);
    ctx.fillStyle = C.white; ctx.fillRect(x + lx - 1 + off, t + 20, 7, 1.4);
  });

  // the sweater: red with the blue-and-white chest band
  ctx.fillStyle = C.red;      ctx.fillRect(x + 2, t + 7, 13, 9);
  ctx.fillStyle = C.redDark;  ctx.fillRect(x + 2, t + 7, 3, 9);
  ctx.fillStyle = C.white;    ctx.fillRect(x + 2, t + 10, 13, 3.6);
  ctx.fillStyle = C.blue;     ctx.fillRect(x + 2, t + 11, 13, 1.8);
  ctx.fillStyle = C.white;    ctx.fillRect(x + 2, t + 7, 13, 1.2);   // shoulder yoke
  ctx.fillStyle = C.blue;     ctx.fillRect(x + 2, t + 15, 13, 1.4);  // hem stripe

  // arms, with the same cuff striping
  const armSwing = run ? -swing : 0;
  ctx.fillStyle = C.red;
  ctx.fillRect(x + 13, t + 8 + armSwing, 3.4, 6);
  ctx.fillRect(x + 1, t + 9 - armSwing, 3.4, 6);
  ctx.fillStyle = C.white;
  ctx.fillRect(x + 13, t + 12 + armSwing, 3.4, 1.4);
  ctx.fillRect(x + 1, t + 13 - armSwing, 3.4, 1.4);
  ctx.fillStyle = C.skinDark;
  ctx.fillRect(x + 13, t + 14 + armSwing, 3.4, 2.4);

  // the stick, angled down and forward
  ctx.save();
  ctx.translate(x + 15, t + 15 + armSwing);
  ctx.rotate(.36 + (run ? swing * .05 : 0));
  ctx.fillStyle = C.stick; ctx.fillRect(0, 0, 13, 1.8);
  ctx.fillStyle = C.tape;  ctx.fillRect(2, 0, 2.4, 1.8);
  ctx.fillStyle = C.tape;  ctx.fillRect(11, -.6, 5, 3);        // taped blade
  ctx.restore();

  // face and helmet
  ctx.fillStyle = C.skin;  ctx.fillRect(x + 4, t + 1, 9, 7);
  ctx.fillStyle = C.skinDark; ctx.fillRect(x + 4, t + 6, 9, 1.4);
  ctx.fillStyle = '#1a1220'; ctx.fillRect(x + 9, t + 3, 1.8, 2);
  ctx.fillStyle = C.hair;  ctx.fillRect(x + 4, t + 5.6, 3, 2.6);     // hair at the nape

  ctx.fillStyle = C.red;                                        // helmet shell
  ctx.beginPath();
  ctx.moveTo(x + 3, t + 3);
  ctx.quadraticCurveTo(x + 8, t - 4, x + 14, t + 2);
  ctx.lineTo(x + 14, t + 4); ctx.lineTo(x + 3, t + 4);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = C.white; ctx.fillRect(x + 3, t + 1.4, 11, 1);
  ctx.fillStyle = C.blue;  ctx.fillRect(x + 3, t + 3.4, 11, 1);
  ctx.fillStyle = C.blade;                                      // cage
  for (let i = 0; i < 3; i++) ctx.fillRect(x + 11, t + 4 + i * 1.6, 4, .8);
  ctx.fillRect(x + 14, t + 4, .9, 4.4);
}

const CHARS = {
  voyageur: { name:'VOYAGEUR', draw:drawHero,   flip:true, entry:'TAKES OVER',
              ball:{ body:HERO.coat,   band:HERO.sash,   dot:HERO.toque } },
  recrue:   { name:'LA RECRUE', draw:drawRecrue, flip:true, entry:'LACES UP',
              ball:{ body:RECRUE.red,  band:RECRUE.white, dot:RECRUE.blue } },
  khn:      { name:'KHN',      draw:drawKhn,    flip:true, pois:true, entry:'TAKES THE STAGE',
              ball:{ body:POIS.ink,   band:POIS.cream, dot:POIS.gold } },
  klek:     { name:'KLEK',     draw:drawKlek,   flip:true, pois:true, entry:'TAKES THE STAGE',
              ball:{ body:POIS.cream, band:POIS.ink,   dot:POIS.gold } },
};

const DEFAULT_CAST = ['khn', 'klek'];   // the band plays every date
function levelCast() { return L.cast || DEFAULT_CAST; }
function activeChar() { return CHARS[levelCast()[castIndex]] || CHARS.voyageur; }

// the backup, walking the lead's path a beat behind
function drawBackup() {
  const cast = levelCast();
  if (castIndex >= cast.length - 1) return;       // nobody left to follow
  if (trail.length <= TRAIL_LAG || player.dead) return;
  const g = trail[trail.length - 1 - TRAIL_LAG];
  if (!g || g.inBarrel) return;                   // don't draw them inside a barrel

  const ch = CHARS[cast[castIndex + 1]];
  const gx = g.x - cam, gy = g.y - camY;
  if (gx < -60 || gx > VW + 60) return;

  const ghost = { x: g.x, y: g.y, w: 16, h: g.h, vx: g.vx, face: g.face,
                  onGround: g.onGround, step: g.step, roll: g.roll,
                  rollAge: g.rollAge, spin: g.spin, climb: 0, dead: false, invuln: 0 };

  ctx.save();
  ctx.globalAlpha = .92;
  if (g.roll > 0) {                               // they roll when the lead rolls
    const cx = gx + 8, cy = gy + g.h / 2, r = 10, B = ch.ball;
    ctx.translate(cx, cy); ctx.rotate(g.spin); ctx.translate(-cx, -cy);
    ctx.fillStyle = B.body;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = B.band;
    [[-5,-2],[2,-5],[-1,2],[-4,5],[5,3]].forEach(d => {
      ctx.beginPath(); ctx.arc(cx + d[0], cy + d[1], 1.6, 0, Math.PI * 2); ctx.fill();
    });
  } else {
    if (g.face < 0) { ctx.translate(gx + 8, 0); ctx.scale(-1, 1); ctx.translate(-(gx + 8), 0); }
    ch.draw(ghost, gx, gy);
  }
  ctx.restore();
}

// Draw-time only: the sprite's *apparent* facing eases across zero so a
// turn-around squeezes to nothing and opens out the other side, the way a
// flat-ish 3D character reads when it pivots. p.face itself is untouched, so
// physics, hitboxes and the roll direction are exactly as before.
let faceVis = 1;
function drawPlayer() {
  const W = VW, H = VH;   // viewport, not canvas
  drawBackup();                                   // behind the lead, so the lead reads first
  const p = player, x = p.x - cam, y = p.y - camY;
  ctx.save();
  if (p.dead) ctx.globalAlpha = .75;

  if (p.roll > 0 || p.inBarrel) { faceVis = p.face;                  // tucked into a ball
    const cx = x + p.w / 2, cy = y + p.h / 2, r = 10;
    if (p.climb > 0) {
      ctx.fillStyle = 'rgba(243,230,210,' + (p.climb / 14).toFixed(2) + ')';
      for (let i = 0; i < 4; i++) ctx.fillRect(cx - p.face * (8 + i * 5), cy + 8 - i, 3, 2);
    }
    if (p.roll > 0 && p.rollAge > 20) {
      ctx.fillStyle = 'rgba(255,206,74,.35)';
      for (let i = 0; i < 3; i++) ctx.fillRect(cx - p.face * (12 + i * 7), cy - 4 + i * 4, 6, 2);
    }
    ctx.translate(cx, cy); ctx.rotate(p.spin); ctx.translate(-cx, -cy);
    const ch = activeChar(), B = ch.ball;
    ctx.fillStyle = B.body;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    if (ch.pois) {                                   // the costume keeps its spots
      ctx.fillStyle = B.band;
      [[-5,-2],[2,-5],[-1,2],[-4,5],[5,3],[4,-1]].forEach(d => {
        ctx.beginPath(); ctx.arc(cx + d[0], cy + d[1], 1.6, 0, Math.PI * 2); ctx.fill();
      });
      ctx.fillStyle = B.dot;                         // the gold triangle, still showing
      ctx.beginPath();
      ctx.moveTo(cx, cy - 4); ctx.lineTo(cx + 3.4, cy + 2); ctx.lineTo(cx - 3.4, cy + 2);
      ctx.fill();
    } else {
      ctx.fillStyle = B.band; ctx.fillRect(cx - r, cy - 2, r * 2, 4);
      ctx.fillStyle = 'rgba(255,255,255,.5)';
      for (let i = 0; i < 4; i++) ctx.fillRect(cx - r + 3 + i * 5, cy - 2, 1, 4);
      ctx.fillStyle = B.dot;
      ctx.beginPath(); ctx.arc(cx, cy - r + 3, 4, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
    return;
  }

  const ch = activeChar();
  faceVis += (p.face - faceVis) * .34;
  const sx = Math.max(.1, Math.abs(faceVis));
  if (sx < .995) {
    const cx = x + p.w / 2;
    ctx.translate(cx, 0); ctx.scale(sx, 1); ctx.translate(-cx, 0);
  }
  if (p.invuln > 0 && Math.floor(timer / 4) % 2) ctx.globalAlpha *= .35;   // swap flicker
  if (ch.draw === drawHero) {
    drawHero(p, x, y);
  } else {
    if (p.face < 0) { ctx.translate(x + p.w / 2, 0); ctx.scale(-1, 1); ctx.translate(-(x + p.w / 2), 0); }
    ch.draw(p, x, y);
  }
  ctx.restore();
}

function banner(title, sub) {
  ctx.fillStyle = 'rgba(13,21,34,.76)'; ctx.fillRect(0, H / 2 - 36, W, 72);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffce4a'; ctx.font = 'bold 19px ui-monospace, monospace';
  ctx.fillText(title, W / 2, H / 2 - 5);
  ctx.fillStyle = 'rgba(243,230,210,.82)'; ctx.font = '10px ui-monospace, monospace';
  ctx.fillText(sub, W / 2, H / 2 + 16);
}

function drawHUD() {
  ctx.font = '10px ui-monospace, monospace';
  ctx.fillStyle = '#f3e6d2';
  ctx.textAlign = 'left';   ctx.fillText('SCORE ' + String(score).padStart(5, '0'), 10, 17);
  ctx.textAlign = 'center';
  ctx.fillText(L.city + '  ' + (inSoundcheck ? 'SOUNDCHECK' : ('NIGHT ' + (levelIndex + 1) + '/' + LEVELS.length)), W / 2, 17);

  // the three city souvenirs, top right — the soundcheck carries none
  if (!inSoundcheck) {
    for (let i = 0; i < 3; i++) {
      const got = letters.some(l => l.i === i && l.got);
      souvenir(L.token, W - 22 - (2 - i) * 20, 5, got ? '#ffce4a' : 'rgba(243,230,210,.20)');
    }
  }

  // progress bar along the route
  const pct = Math.max(0, Math.min(1, player.x / (LEVEL_W - 60)));
  ctx.fillStyle = 'rgba(243,230,210,.16)'; ctx.fillRect(10, 24, W - 20, 2);
  ctx.fillStyle = theme.edge; ctx.fillRect(10, 24, (W - 20) * pct, 2);

  // the cast, for stages that field more than one act
  const cast = levelCast();
  if (cast.length > 1) {
    ctx.textAlign = 'left';
    ctx.font = '8px ui-monospace, monospace';
    ctx.fillStyle = 'rgba(243,230,210,.45)';
    ctx.fillText(L.act || 'ANGINE DE POITRINE', 10, 34);
    ctx.font = 'bold 9px ui-monospace, monospace';
    for (let i = 0; i < cast.length; i++) {
      const nm = CHARS[cast[i]].name;
      ctx.fillStyle = i < castIndex ? 'rgba(243,230,210,.22)'
                    : i === castIndex ? '#ff6fae' : 'rgba(243,230,210,.6)';
      ctx.fillText((i === castIndex ? '\u25b8' : ' ') + nm, 10, 45 + i * 11);
    }
  }

  if (swapFlash > 0) {
    ctx.textAlign = 'center'; ctx.font = 'bold 13px ui-monospace, monospace';
    ctx.fillStyle = 'rgba(255,111,174,' + Math.min(1, swapFlash / 30).toFixed(2) + ')';
    const inc = CHARS[cast[castIndex]];
    ctx.fillText(inc.name + ' ' + (inc.entry || 'STEPS IN'), W / 2, 62);
  }

  if (bonusFlash > 0) {
    bonusFlash--;
    ctx.textAlign = 'center'; ctx.font = 'bold 12px ui-monospace, monospace';
    ctx.fillStyle = 'rgba(255,206,74,' + Math.min(1, bonusFlash / 30).toFixed(2) + ')';
    ctx.fillText('ALL ' + L.tokenName + ' FOUND  +1500', W / 2, 48);
  }

  if (state === 'intro')         banner(inSoundcheck ? 'SOUNDCHECK' : L.city, L.sub);
  else if (state === 'clear') {
    if (inSoundcheck) {
      banner('SOUNDCHECK CLEAR', '+' + (score - levelStartScore) + ' · the tour starts whenever you are ready');
    } else {
      const r = tourLog[levelIndex];
      const line = r ? (r.notes + '/3 notes · ' + fmtTime(r.frames) + ' · +' + r.earned +
                        (r.clean ? ' · CLEAN' : ''))
                     : 'on to the next date...';
      banner(levelIndex === LEVELS.length - 1 ? 'TOUR COMPLETE' : 'SHOW OVER', line);
    }
  }
  else if (state === 'complete') banner('TOUR COMPLETE', 'press ENTER to book it again');
  else if (player.dead)          banner(player.fell ? 'DOWN YOU GO' : (L.overLine || "THAT'S THE ACT"),
                                        player.fell ? 'nobody catches that one' : 'back to the top');

  if (inSoundcheck && state === 'play') drawSoundcheckTip();
}

// a caption tied to the column the player is standing in — the explicit,
// on-screen instruction the soundcheck is supposed to give at each beat
function drawSoundcheckTip() {
  const col = Math.floor(player.x / TILE);
  const tip = (SAGUENAY.tips || []).find(t => col >= t.from && col <= t.to);
  if (!tip) return;
  ctx.font = 'bold 9px ui-monospace, monospace';
  ctx.textAlign = 'center';
  const w = Math.min(W - 16, ctx.measureText(tip.text).width + 20);
  ctx.fillStyle = 'rgba(10,22,30,.78)';
  ctx.fillRect(W / 2 - w / 2, H - 32, w, 17);
  ctx.strokeStyle = 'rgba(159,216,208,.4)'; ctx.lineWidth = 1;
  ctx.strokeRect(W / 2 - w / 2 + .5, H - 32 + .5, w - 1, 16);
  ctx.fillStyle = '#9fd8d0';
  ctx.fillText(tip.text, W / 2, H - 20);
}

// ============================ route map ============================
// the marker moving between dates — drawn as the act itself
function tourToken(x, y, who) {
  const ch = CHARS[who] || CHARS.voyageur;
  if (!ch.pois) {                                   // the old walker, for other variants
    ctx.fillStyle = HERO.pack;  ctx.fillRect(x - 6, y - 2, 3, 5);
    ctx.fillStyle = HERO.coat;  ctx.fillRect(x - 4, y - 3, 8, 8);
    ctx.fillStyle = HERO.sash;  ctx.fillRect(x - 4, y, 8, 2);
    ctx.fillStyle = HERO.skin;  ctx.fillRect(x - 3, y - 8, 6, 5);
    ctx.fillStyle = HERO.beard; ctx.fillRect(x - 3, y - 5, 6, 2);
    ctx.fillStyle = HERO.toque; ctx.fillRect(x - 4, y - 11, 8, 3);
    ctx.fillStyle = HERO.pom;   ctx.fillRect(x - 1, y - 13, 2, 2);
    return;
  }

  const khn = who === 'khn';
  const suit = khn ? POIS.ink : POIS.cream;         // the costumes invert each other
  const spot = khn ? POIS.cream : POIS.ink;

  ctx.fillStyle = suit;                             // body
  ctx.fillRect(x - 4, y - 3, 8, 9);
  ctx.fillStyle = spot;                             // spots
  [[-2, -1], [1, 1], [-1, 3], [2, -2]].forEach(d => {
    ctx.beginPath(); ctx.arc(x + d[0], y + d[1], .9, 0, Math.PI * 2); ctx.fill();
  });
  ctx.fillStyle = POIS.gold;                        // the gold triangle
  ctx.beginPath();
  ctx.moveTo(x, y - 1); ctx.lineTo(x + 2, y + 2.4); ctx.lineTo(x - 2, y + 2.4); ctx.fill();

  if (khn) {                                        // white trapezoid headpiece
    ctx.fillStyle = POIS.cream;
    ctx.beginPath();
    ctx.moveTo(x - 6, y - 14); ctx.lineTo(x + 6, y - 14);
    ctx.lineTo(x + 2, y - 4); ctx.lineTo(x - 2, y - 4);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = POIS.ink;
    [[-3, -11], [2, -12], [0, -8], [-1, -6]].forEach(d => {
      ctx.beginPath(); ctx.arc(x + d[0], y + d[1], .85, 0, Math.PI * 2); ctx.fill();
    });
    ctx.fillStyle = POIS.gold;
    ctx.beginPath();
    ctx.moveTo(x, y - 12); ctx.lineTo(x + 1.8, y - 9); ctx.lineTo(x - 1.8, y - 9); ctx.fill();
    ctx.fillStyle = POIS.fringe;                    // the fringe
    for (let i = 0; i < 4; i++) ctx.fillRect(x - 3 + i * 2, y - 5, 1, 3);
  } else {                                          // black dome with the gold tip
    ctx.fillStyle = POIS.ink;
    ctx.beginPath();
    ctx.moveTo(x - 4, y - 4); ctx.lineTo(x - 4, y - 10);
    ctx.quadraticCurveTo(x, y - 15, x + 4, y - 10);
    ctx.lineTo(x + 4, y - 4); ctx.closePath(); ctx.fill();
    ctx.fillStyle = POIS.cream;
    [[-2, -9], [2, -8], [0, -12], [-1, -6]].forEach(d => {
      ctx.beginPath(); ctx.arc(x + d[0], y + d[1], .85, 0, Math.PI * 2); ctx.fill();
    });
    ctx.fillStyle = POIS.gold;
    ctx.beginPath();
    ctx.moveTo(x, y - 17); ctx.lineTo(x + 1.8, y - 14); ctx.lineTo(x - 1.8, y - 14); ctx.fill();
    ctx.fillRect(x - 2.4, y - 6, 4.8, 1.2);         // the mouth bar
  }
}

function drawRouteMap(progress) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#08111f'); g.addColorStop(1, '#122036');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = '#1d3350';
  ctx.beginPath();
  ctx.moveTo(-10, 235); ctx.lineTo(18, 148); ctx.lineTo(110, 118);
  ctx.lineTo(182, 94); ctx.lineTo(252, 108); ctx.lineTo(270, 152);
  ctx.lineTo(232, 212); ctx.lineTo(78, 248); ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(492, 58); ctx.lineTo(368, 96); ctx.lineTo(358, 162);
  ctx.lineTo(402, 212); ctx.lineTo(492, 222); ctx.closePath(); ctx.fill();

  ctx.strokeStyle = 'rgba(127,224,192,.35)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(38, 198); ctx.quadraticCurveTo(140, 158, 242, 126);
  ctx.lineTo(300, 128); ctx.stroke();

  ctx.strokeStyle = 'rgba(127,180,224,.15)'; ctx.lineWidth = 1;
  for (let i = 0; i < 8; i++) {
    const yy = 96 + i * 17 + Math.sin(timer * .03 + i) * 2;
    ctx.beginPath(); ctx.moveTo(274, yy); ctx.lineTo(356, yy); ctx.stroke();
  }

  ctx.font = '8px ui-monospace, monospace';
  for (let i = 0; i < ROUTE.length - 1; i++) {
    const a = ROUTE[i], b = ROUTE[i + 1];
    const done = i < (progress ? progress.from : levelIndex);
    const active = progress && i === progress.from;
    const sea = i === ROUTE.length - 2;
    ctx.setLineDash(sea ? [5, 4] : [3, 3]);
    ctx.lineWidth = active ? 2 : 1;
    ctx.strokeStyle = active ? '#ffce4a' : done ? 'rgba(255,206,74,.5)' : 'rgba(243,230,210,.2)';
    ctx.beginPath();
    if (sea) { ctx.moveTo(a.x, a.y); ctx.quadraticCurveTo((a.x + b.x) / 2, 38, b.x, b.y); }
    else { ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); }
    ctx.stroke();
  }
  ctx.setLineDash([]);

  ROUTE.forEach((c, i) => {
    if (c.dup) return;                      // same city, already drawn
    const reached = i <= (progress ? progress.to : levelIndex);
    ctx.fillStyle = reached ? '#ffce4a' : 'rgba(243,230,210,.35)';
    ctx.beginPath(); ctx.arc(c.x, c.y, i === 5 ? 5 : 4, 0, Math.PI * 2); ctx.fill();
    if (i === 0) { ctx.strokeStyle = '#e0463c'; ctx.lineWidth = 1;
                   ctx.beginPath(); ctx.arc(c.x, c.y, 8, 0, Math.PI * 2); ctx.stroke(); }
    ctx.fillStyle = reached ? '#f3e6d2' : 'rgba(243,230,210,.4)';
    ctx.textAlign = c.x > 380 ? 'right' : 'left';
    ctx.fillText(c.name, c.x + (c.x > 380 ? -9 : 9), c.y + 3);
  });

  // the soundcheck: off the tour proper, so it hangs off Québec on a dashed
  // lead-in rather than joining the polyline of the eight real dates
  {
    const qc = ROUTE.find(r => r.name === 'QUÉBEC');
    if (qc) {
      ctx.setLineDash([2, 3]); ctx.lineWidth = 1;
      ctx.strokeStyle = 'rgba(159,216,208,.28)';
      ctx.beginPath(); ctx.moveTo(qc.x, qc.y); ctx.lineTo(SAG_POINT.x, SAG_POINT.y); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(159,216,208,.4)';
      ctx.beginPath(); ctx.arc(SAG_POINT.x, SAG_POINT.y, 3, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(159,216,208,.5)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(SAG_POINT.x, SAG_POINT.y, 5, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = 'rgba(159,216,208,.55)';
      ctx.textAlign = 'left';
      ctx.fillText(SAG_POINT.name + ' (0)', SAG_POINT.x + 8, SAG_POINT.y + 3);
    }
  }

  if (progress) {
    const a = ROUTE[progress.from], b = ROUTE[progress.to], t = progress.t;
    let x, y;
    if (progress.ocean) {
      const mx = (a.x + b.x) / 2, my = 38, u = 1 - t;
      x = u * u * a.x + 2 * u * t * mx + t * t * b.x;
      y = u * u * a.y + 2 * u * t * my + t * t * b.y;
    } else {
      x = a.x + (b.x - a.x) * t;
      y = a.y + (b.y - a.y) * t - Math.abs(Math.sin(t * Math.PI * 5)) * 12;
    }
    ctx.fillStyle = 'rgba(255,206,74,.25)';
    ctx.beginPath(); ctx.arc(x, y, 8, 0, Math.PI * 2); ctx.fill();
    tourToken(x, y, levelCast()[0]);
  }

  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffce4a'; ctx.font = 'bold 12px ui-monospace, monospace';
  ctx.fillText(progress && progress.ocean ? 'FLYING THE ATLANTIC'
             : progress ? 'NEXT DATE: ' + ROUTE[progress.to].name : 'TOUR DATES', W / 2, 30);
  ctx.fillStyle = 'rgba(243,230,210,.6)'; ctx.font = '9px ui-monospace, monospace';
  ctx.fillText(progress ? 'tap or press SPACE to skip ahead'
                        : 'tap to return · buttons below jump to any date', W / 2, H - 14);
}

// ============================ frame ============================
function draw() {
  if (booting) { drawBoot(); return; }
  drawScene();
  quantizePalette();                  // post-process, full canvas
  if (postFX.debug) drawFxDebug();
}

// ---- cartridge / console boot ------------------------------------------
// Runs once on load, ahead of the title. Any input skips it, and it is a pure
// draw-time state: update() never sees it, so nothing in the game advances.
let booting = 1, bootT = 0;
const drawBoot = guard(function () {
  bootT++;
  if (bootT > 190) { booting = 0; return; }
  ctx.fillStyle = '#05070c'; rawFillRect.call(ctx, 0, 0, W, H);
  ctx.textAlign = 'center';

  // the cartridge seating into the slot
  const seat = Math.min(1, bootT / 46);
  const cy = 96 - (1 - seat) * (1 - seat) * 70;
  ctx.fillStyle = '#2b2f3c'; rawFillRect.call(ctx, W / 2 - 46, cy, 92, 54);
  ctx.fillStyle = '#3a4152'; rawFillRect.call(ctx, W / 2 - 46, cy, 92, 5);
  ctx.fillStyle = '#12151d'; rawFillRect.call(ctx, W / 2 - 34, cy + 12, 68, 26);
  ctx.fillStyle = '#ffce4a'; ctx.font = 'bold 9px ui-monospace, monospace';
  ctx.fillText('TOURNÉE', W / 2, cy + 28);
  ctx.fillStyle = '#1a1e28'; rawFillRect.call(ctx, W / 2 - 52, 150, 104, 12);

  if (bootT > 52) {                                  // power-up flicker
    const f = bootT - 52, on = f > 22 || (f >> 1) % 2;
    if (on) {
      ctx.fillStyle = 'rgba(127,224,192,' + Math.min(.9, f / 40).toFixed(2) + ')';
      ctx.font = '8px ui-monospace, monospace';
      ctx.fillText('ANGINE DE POITRINE', W / 2, 186);
      if (f > 40) { ctx.fillStyle = 'rgba(243,230,210,.5)';
                    ctx.fillText('EN TOURNÉE · 8 DATES', W / 2, 200); }
    }
  }
  if (bootT > 120) {
    ctx.fillStyle = 'rgba(243,230,210,' + (.25 + .25 * Math.sin(bootT * .12)).toFixed(2) + ')';
    ctx.font = '7px ui-monospace, monospace';
    ctx.fillText('PRESS ANY BUTTON', W / 2, 232);
  }
  ctx.textAlign = 'left';
  if (postFX.crt) { const img = ctx.getImageData(0, 0, W, H); crtPixels(img.data);
                    ctx.putImageData(img, 0, 0); crtVignette(); }
}, 'drawBoot');

// Instrumentation, not decoration: says what actually executed this frame,
// so "is anything happening?" is answerable without squinting.
const drawFxDebug = guard(function () {
  ctx.fillStyle = 'rgba(0,0,0,.72)'; rawFillRect.call(ctx, 4, 4, 150, 70);
  ctx.font = '8px ui-monospace, monospace'; ctx.textAlign = 'left';
  const rows = [
    'MASTER (N) : ' + (postFX.on ? 'ON' : 'OFF'),
    'fxLevel    : ' + fxLevel + '   frame ' + frameCost.toFixed(1) + 'ms',
    'update     : ' + updateCost.toFixed(1) + 'ms  x' + updatesPerFrame.toFixed(1) + '/tick',
    'quantize   : ' + (fxRan.quant ? 'ran, ' + postFX.bits + ' bit/ch' : 'SKIPPED'),
    'facets     : ' + (fxRan.facets ? 'ran' : 'SKIPPED'),
    'crt        : ' + (fxRan.crt ? 'ran' : 'SKIPPED'),
    'fog x' + postFX.fog
  ];
  rows.forEach((r, i) => {
    ctx.fillStyle = /SKIPPED|OFF/.test(r) ? '#ff6f6f' : '#7fe0c0';
    ctx.fillText(r, 8, 14 + i * 9);
  });
}, 'drawFxDebug');

function drawScene() {
  if (state === 'results') { drawResults(); return; }
  if (state === 'cut')     { drawCut(); return; }
  if (state === 'travel')  { drawRouteMap(travel); return; }
  if (state === 'mapview') { drawRouteMap(null); return; }

  const tx = player.x + player.w / 2 - VW * .4;
  cam += (tx - cam) * .12;
  cam = Math.max(0, Math.min(cam, LEVEL_W - VW));

  // Vertical camera: anchor to the last solid footing, not to live y.
  // Jumping and falling move the player, not the view, until they leave the band.
  if (player.onGround) anchorY = player.y;
  const focus = Math.abs(player.y - anchorY) > DEADZONE
    ? player.y - Math.sign(player.y - anchorY) * DEADZONE
    : anchorY;
  const ty = Math.max(0, Math.min(focus + player.h / 2 - VH * .58, LEVEL_H - VH));
  camY += (ty - camY) * (player.onGround ? .1 : .05);
  camY = Math.max(0, Math.min(camY, LEVEL_H - VH));

  ctx.save();
  ctx.scale(ZOOM, ZOOM);              // everything below is in viewport units
  drawSky();
  drawFarLayer();
  applyFog(1);                        // horizon
  drawLandmarks();
  applyFog(.55);                      // landmark plane
  wobbleOn(); drawMidLayer(); wobbleOff();
  applyFog(.22);                      // near scenery
  if (theme.snow) drawSnow(false);
  facetPass(true);                    // vertex-lit faces from here down
  drawTiles();
  drawMovers(); drawTires(); drawBarrels();
  drawCoins(); drawSouvenirs(); drawFlag();
  drawEnemies();
  lit = LIT_PLAYER; drawPlayer(); lit = LIT_WORLD;
  facetPass(false);
  if (theme.snow) drawSnow(true);
  ctx.restore();
  drawHUD();                          // HUD stays at canvas scale
}

let acc = 0, last = performance.now();
const STEP = 1000 / 60;
// Adaptive detail: sample how long frames actually take and drop the most
// expensive decorations first. Better a plainer stage than a stuttering one.
let fxLevel = 1, frameCost = 16.7, lastFrameStart = 0;
function sampleFrame(now) {
  if (lastFrameStart) {
    const dt = now - lastFrameStart;
    frameCost += (Math.min(dt, 100) - frameCost) * .05;   // slow rolling average
    if (frameCost > 22 && fxLevel > 0) { fxLevel--; trimEffects(); }
    else if (frameCost < 15 && fxLevel < 1) { fxLevel++; trimEffects(); }
  }
  lastFrameStart = now;
}
function trimEffects() {
  // the post-process pass reads fxLevel directly (see quantizePalette) and
  // switches itself off at level 0 along with the snow field below
  if (!snowField) return;
  const want = fxLevel ? { near: 26, far: 30 } : { near: 12, far: 12 };
  ['near', 'far'].forEach(k => {
    const a = snowField[k];
    while (a.length > want[k]) a.pop();
    while (a.length < want[k]) a.push({
      x: Math.random() * (VW + 40), y: Math.random() * (VH + 40),
      fall: k === 'near' ? 1.15 + Math.random() * .7 : .45 + Math.random() * .3,
      sway: (k === 'near' ? .5 : .25) * (.6 + Math.random() * .8), phase: 0
    });
  });
}

// paint the failure on the canvas: the sandbox reports these as "Script error."
// in the console, which tells nobody anything
function drawError() {
  ctx.fillStyle = 'rgba(20,8,12,.94)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ff6f6f'; ctx.font = 'bold 12px ui-monospace, monospace';
  ctx.fillText('SOMETHING BROKE', W / 2, 40);
  ctx.fillStyle = '#f3e6d2'; ctx.font = '9px ui-monospace, monospace';
  const msg = String(lastError.msg);
  for (let i = 0; i < 3; i++) {
    const part = msg.slice(i * 54, (i + 1) * 54);
    if (part) ctx.fillText(part, W / 2, 64 + i * 13);
  }
  ctx.fillStyle = 'rgba(243,230,210,.6)'; ctx.font = '8px ui-monospace, monospace';
  ctx.fillText('in: ' + lastError.where, W / 2, 112);
  ctx.fillText(String(lastError.line).trim().slice(0, 64), W / 2, 126);
  ctx.fillText('stage ' + (levelIndex + 1) + ' · ' + (L ? L.city : '?') + ' · ' + errorCount + ' error(s)',
               W / 2, 146);
  ctx.fillStyle = 'rgba(243,230,210,.45)';
  ctx.fillText('tap to try to continue', W / 2, H - 16);
  ctx.textAlign = 'left';
}

// draw() ends with two full-canvas getImageData/putImageData passes (quantize,
// then CRT) — real work, not just a paint. requestAnimationFrame fires at the
// display's native refresh rate, so on a 120/144Hz desktop monitor this used
// to run those passes 2-3x as often as on a 60Hz phone panel for no visual
// gain, since update() was already locked to 60Hz. Gate drawing itself to the
// same ~60fps wall-clock cadence so the expensive part scales with the game,
// not with whatever monitor happens to be plugged in.
let lastDraw = 0;
let updateCost = 0, updatesPerFrame = 0;  // measured separately from draw/frame timing — a
                                           // fixed-timestep loop can silently "spiral": if
                                           // update() alone ever runs longer than STEP, the
                                           // catch-up while-loop below starts stacking multiple
                                           // update() calls per rAF tick to stay in sync, which
                                           // costs more real time, which falls further behind —
                                           // a real bug class, and invisible to frameCost, which
                                           // only measures draw().
function loop(now) {
  const t0 = performance.now();
  let n = 0;
  try {
    acc += Math.min(now - last, 250); last = now;
    if (booting) acc = 0;               // the boot splash freezes the world
    while (acc >= STEP) { update(); acc -= STEP; n++; }
  } catch (e) { reportError(e, 'update'); acc = 0; }
  const um = performance.now() - t0;
  updateCost += (um - updateCost) * .1;
  updatesPerFrame += (n - updatesPerFrame) * .1;
  if (now - lastDraw >= STEP - 1) {
    lastDraw = now;
    sampleFrame(now);                   // measure actual draw-to-draw cost, not raw rAF cadence
    try {
      if (lastError) drawError(); else draw();
      restoreCtx();
    } catch (e) {
      restoreCtx();
      reportError(e, 'draw');
      try { drawError(); } catch (_) {}
    }
  }
  requestAnimationFrame(loop);            // never let one bad frame stop the game
}

addEventListener('error', ev => {
  // A cross-origin script the sandbox won't describe reports as "Script error."
  // with no error object. That is not our failure — don't hijack the screen for it.
  const opaque = !ev.error && (!ev.message || /script error/i.test(ev.message));
  if (opaque) return;                      // host-page noise: not ours, and not worth logging
  reportError(ev.error || { message: ev.message }, 'window');
});
addEventListener('unhandledrejection', ev => { if (ev.reason) reportError(ev.reason, 'promise'); });

loadLevel(0, 'new');
requestAnimationFrame(loop);
})();
</script>
</body>
