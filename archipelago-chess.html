@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=IBM+Plex+Mono:wght@400;600&display=swap');

.ac-root{
  --abyss:#04161C; --ink2:#0D2A31; --ink3:#143D45;
  --sand:#F3E3BC; --sand2:#E2CB9C; --teal:#3E7C86; --teal2:#2F646E; --edge:#1E505A;
  --amber:#F5A03C; --sea:#57D6C2; --rose:#F2645C;
  --cream:#FDF6E6; --slate:#0B2229;
  font-family:'IBM Plex Mono',ui-monospace,monospace;
  background:
    radial-gradient(140% 70% at 50% -10%, #1B5A63 0%, transparent 55%),
    radial-gradient(90% 50% at 90% 105%, #22303A 0%, transparent 60%),
    var(--abyss);
  color:var(--sand); min-height:100vh; padding:14px 14px 26px;
  max-width:520px; margin:0 auto; -webkit-tap-highlight-color:transparent;
}
.ac-root *{box-sizing:border-box}
.ac-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.ac-brand{display:flex;align-items:center;gap:8px}
.ac-mark{color:var(--amber);font-size:20px;line-height:1}
.ac-wordmark{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:19px;letter-spacing:-0.02em;color:var(--cream)}
.ac-ghostbtn{background:transparent;border:1px solid var(--edge);color:var(--sand);font-family:inherit;font-size:12px;padding:7px 12px;border-radius:999px;cursor:pointer;transition:border-color .2s,color .2s,box-shadow .2s}
.ac-ghostbtn:hover{border-color:var(--amber);color:var(--amber);box-shadow:0 0 18px -6px var(--amber)}
.ac-wide{width:100%;margin-top:8px;padding:12px}
.ac-boardmeta{display:flex;align-items:baseline;gap:9px;margin-bottom:12px;flex-wrap:wrap}
.ac-boardname{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:26px;letter-spacing:-0.03em;
  background:linear-gradient(92deg,var(--cream),var(--amber));-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:acslide .45s cubic-bezier(.2,.9,.3,1)}
@keyframes acslide{from{opacity:0;transform:translateX(-10px)}}
.ac-dims{font-size:11px;color:var(--amber);border:1px solid var(--edge);border-radius:999px;padding:2px 8px}
.ac-blurb{font-size:11.5px;color:#9FC0BC;flex-basis:100%}

.ac-player{display:flex;align-items:center;gap:11px;padding:9px 2px}
.ac-player--top{padding-bottom:12px}
.ac-avatar{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:20px;flex:none;border:1px solid var(--edge)}
.ac-avatar--b{background:var(--ink3);color:var(--sand)}
.ac-avatar--w{background:var(--sand);color:var(--slate)}
.ac-pname{font-size:13px;color:var(--cream);font-weight:600}
.ac-depthtag{font-size:10px;color:#7FAFA8;font-weight:400;margin-left:5px}
.ac-taken{display:flex;gap:1px;flex-wrap:wrap;max-width:250px;min-height:17px;margin-top:3px}
svg.ac-mini{width:16px;height:16px;flex:none;opacity:.85;animation:acpop .3s cubic-bezier(.2,1.4,.4,1)}
@keyframes acpop{from{transform:scale(.2);opacity:0}}
.ac-turnlight{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--edge);transition:background .3s,box-shadow .3s}
.ac-turnlight[data-on="true"]{background:var(--amber);box-shadow:0 0 0 4px rgba(245,160,60,.18);animation:acbeat 2s ease-in-out infinite}
@keyframes acbeat{50%{box-shadow:0 0 0 8px rgba(245,160,60,.06)}}
.ac-pulse{width:9px;height:9px;border-radius:50%;background:var(--amber);animation:acp 1s ease-in-out infinite}
@keyframes acp{0%,100%{transform:scale(.6);opacity:.5}50%{transform:scale(1.15);opacity:1}}

.ac-boardwrap{filter:drop-shadow(0 20px 34px rgba(0,0,0,.6))}
.ac-shake{animation:acs .28s ease}
.ac-shake--hard{animation:acsh .5s cubic-bezier(.3,.7,.4,1)}
@keyframes acsh{12%{transform:translate(-9px,4px) rotate(-.5deg)}28%{transform:translate(8px,-5px) rotate(.5deg)}46%{transform:translate(-6px,-3px)}64%{transform:translate(5px,3px)}82%{transform:translate(-3px,1px)}100%{transform:none}}
@keyframes acs{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.ac-board{position:relative;width:100%;border-radius:8px}

/* ---- the ground the board sits in, themed per battlefield ---- */
.ac-gap{position:absolute;inset:-2%;border-radius:14px;z-index:0}
.ac-gap::after{content:"";position:absolute;inset:0;border-radius:14px;
  box-shadow:inset 0 0 60px 12px rgba(0,0,0,.55)}

/* WATER \u2014 a river or lagoon: slow drifting caustics, cool and alive */
.ac-gap--water{
  background:
    radial-gradient(60% 40% at 20% 30%, rgba(87,214,194,.20), transparent 70%),
    radial-gradient(50% 40% at 80% 70%, rgba(62,124,134,.34), transparent 70%),
    repeating-linear-gradient(101deg, rgba(150,235,220,.055) 0 2px, transparent 2px 13px),
    linear-gradient(150deg,#04212A,#0A3A44,#04212A);
  background-size:200% 200%,200% 200%,auto,300% 300%;
  animation:acflow 17s ease-in-out infinite}
@keyframes acflow{50%{background-position:100% 50%,0% 50%,0 0,100% 50%}}

/* STONE \u2014 mountains and ridges: hard strata, no movement, cold grey-blue */
.ac-gap--stone{
  background:
    repeating-linear-gradient(74deg, rgba(0,0,0,.34) 0 3px, transparent 3px 11px),
    repeating-linear-gradient(-26deg, rgba(190,205,215,.05) 0 1px, transparent 1px 9px),
    linear-gradient(160deg,#20303A,#151F27 55%,#0C151B);
  animation:acgrind 26s linear infinite}
@keyframes acgrind{50%{background-position:5px 0,-4px 0,0 0}}

/* MARSH \u2014 bog: mottled olive, sluggish blooms rising and fading */
.ac-gap--marsh{
  background:
    radial-gradient(35% 28% at 30% 65%, rgba(139,150,74,.24), transparent 70%),
    radial-gradient(30% 24% at 72% 28%, rgba(96,116,60,.30), transparent 70%),
    radial-gradient(22% 18% at 52% 82%, rgba(160,150,90,.14), transparent 70%),
    linear-gradient(150deg,#1B2317,#242C18 50%,#141A11);
  background-size:180% 180%,160% 160%,140% 140%,auto;
  animation:acbog 24s ease-in-out infinite}
@keyframes acbog{33%{background-position:20% 60%,70% 20%,40% 90%,0 0}
                 66%{background-position:60% 20%,20% 70%,70% 40%,0 0}}

/* CHASM \u2014 a rift or dry moat: near-black, embers breathing far below */
.ac-gap--chasm{
  background:
    radial-gradient(45% 30% at 50% 55%, rgba(245,120,40,.20), transparent 72%),
    radial-gradient(28% 20% at 22% 30%, rgba(200,70,30,.16), transparent 72%),
    radial-gradient(30% 22% at 78% 74%, rgba(180,60,25,.14), transparent 72%),
    linear-gradient(170deg,#12080A,#050203 60%,#0C0507);
  background-size:200% 200%,170% 170%,170% 170%,auto;
  animation:acember 11s ease-in-out infinite}
@keyframes acember{50%{background-position:50% 40%,40% 60%,60% 40%,0 0;filter:brightness(1.35)}}

/* the page itself picks up the terrain's cast */
.ac-root[data-terrain="stone"]{--abyss:#0A1218;
  background:radial-gradient(140% 70% at 50% -10%,#2A3B47 0%,transparent 55%),
             radial-gradient(90% 50% at 90% 105%,#1A242C 0%,transparent 60%),var(--abyss)}
.ac-root[data-terrain="marsh"]{--abyss:#0D1310;
  background:radial-gradient(140% 70% at 50% -10%,#33401F 0%,transparent 55%),
             radial-gradient(90% 50% at 90% 105%,#1F2A18 0%,transparent 60%),var(--abyss)}
.ac-root[data-terrain="chasm"]{--abyss:#0B0507;
  background:radial-gradient(140% 70% at 50% -10%,#4A1F14 0%,transparent 50%),
             radial-gradient(90% 50% at 90% 105%,#241012 0%,transparent 60%),var(--abyss)}

.ac-sq{position:absolute;border-radius:3px;cursor:pointer;z-index:1;
  transition:box-shadow .18s,filter .18s,left .58s cubic-bezier(.5,.02,.3,1),top .58s cubic-bezier(.5,.02,.3,1);
  animation:acdeal .38s cubic-bezier(.2,.9,.3,1) backwards}
@keyframes acdeal{from{opacity:0;transform:scale(.55)}}
.ac-sq--l{background:linear-gradient(150deg,var(--sand) 0%,var(--sand2) 100%)}
.ac-sq--d{background:linear-gradient(150deg,var(--teal) 0%,var(--teal2) 100%)}
.ac-sq.is-last{box-shadow:inset 0 0 0 200px rgba(245,160,60,.26)}
.ac-sq.is-sel{box-shadow:inset 0 0 0 3px var(--amber),0 0 16px -2px var(--amber)}
.ac-sq.is-hint{box-shadow:inset 0 0 0 3px var(--sea);animation:achint .9s ease-in-out infinite}
@keyframes achint{50%{box-shadow:inset 0 0 0 3px var(--sea),0 0 20px 0 rgba(87,214,194,.5)}}
.ac-sq.is-check{animation:acc 1.05s ease-in-out infinite}
@keyframes acc{0%,100%{box-shadow:inset 0 0 0 200px rgba(242,100,92,0)}50%{box-shadow:inset 0 0 0 200px rgba(242,100,92,.55)}}
.ac-dot{position:absolute;inset:0;margin:auto;width:26%;height:26%;border-radius:50%;background:rgba(11,34,41,.34);animation:acd .2s cubic-bezier(.2,1.5,.4,1)}
.ac-ring{position:absolute;inset:6%;border-radius:50%;border:2.5px solid rgba(242,100,92,.8);animation:acd .2s cubic-bezier(.2,1.5,.4,1)}
@keyframes acd{from{transform:scale(.2);opacity:0}}
.ac-coord{position:absolute;font-size:8.5px;font-weight:600;color:rgba(11,34,41,.42);pointer-events:none}
.ac-coord--f{bottom:1px;right:3px}
.ac-coord--r{top:1px;left:3px}

.ac-piece{position:absolute;display:grid;place-items:center;pointer-events:none;z-index:3;
  transition:left var(--dur,200ms) cubic-bezier(.33,.02,.24,1),top var(--dur,200ms) cubic-bezier(.33,.02,.24,1)}
.ac-piece--mine{pointer-events:auto;cursor:pointer}
.ac-svg{display:block;overflow:visible;transition:transform .18s cubic-bezier(.2,1.3,.4,1),filter .18s}
.ac-svg path{stroke-linejoin:round;stroke-linecap:round}
.ac-svg--w path{fill:var(--cream);stroke:#33474C;stroke-width:5}
.ac-svg--b path{fill:#12333B;stroke:#03161B;stroke-width:5}
.ac-svg--w .ac-slit,.ac-svg--b .ac-slit{fill:none;stroke-width:6}
.ac-svg--w .ac-slit{stroke:#33474C}
.ac-svg--b .ac-slit{stroke:#03161B}
.ac-piece .ac-svg{width:86%;height:86%;filter:drop-shadow(0 2px 2px rgba(0,0,0,.45))}
.ac-piece--mine:hover .ac-svg{transform:translateY(-2px)}
.ac-piece.is-lifted{z-index:5}
.ac-piece.is-lifted .ac-svg{transform:translateY(-7%) scale(1.1);filter:drop-shadow(0 7px 6px rgba(0,0,0,.55));animation:acbob 1.4s ease-in-out infinite .2s}
@keyframes acbob{50%{transform:translateY(-11%) scale(1.1)}}
.ac-piece.is-arrive .ac-svg{animation:acland .3s cubic-bezier(.2,1.2,.35,1) var(--dur,200ms) backwards}
@keyframes acland{0%{transform:translateY(-16%) scale(1.12)}55%{transform:scaleX(1.14) scaleY(.86)}100%{transform:none}}
.ac-piece--ghost{z-index:2;animation:acgh .32s ease forwards}
@keyframes acgh{to{transform:scale(.35) rotate(16deg);opacity:0}}
.ac-wave{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(242,100,92,.7);animation:acwave .4s ease-out forwards}
@keyframes acwave{to{transform:scale(2.1);opacity:0;border-width:1px}}

/* ---- minesweeper ---- */
.ac-minecount{font-size:11px;color:#FF9B6A;border:1px solid rgba(255,155,106,.4);border-radius:999px;padding:2px 8px;
  animation:actick 2.6s ease-in-out infinite}
@keyframes actick{50%{border-color:rgba(255,155,106,.9);box-shadow:0 0 12px -3px rgba(255,120,60,.7)}}
.ac-clue{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--fs,40px) * .42);
  font-weight:600;pointer-events:none;animation:acpop .26s cubic-bezier(.2,1.4,.4,1)}
.ac-clue[data-n="0"]{background:rgba(11,34,41,.16);border-radius:3px}
.ac-clue[data-n="1"]{color:#2E7D93}
.ac-clue[data-n="2"]{color:#3E7C4A}
.ac-clue[data-n="3"]{color:#C2622C}
.ac-clue[data-n="4"]{color:#9E3B78}
.ac-clue[data-n="5"],.ac-clue[data-n="6"],.ac-clue[data-n="7"],.ac-clue[data-n="8"]{color:#B32B2B}
.ac-piece--blast{z-index:8;pointer-events:none}
.ac-piece--blast .ac-svg{animation:acblast .42s cubic-bezier(.3,.7,.4,1) forwards}
@keyframes acblast{
  0%{transform:none;filter:brightness(1)}
  18%{transform:scale(1.35);filter:brightness(3.5) saturate(0)}
  100%{transform:scale(.15) rotate(38deg);opacity:0;filter:brightness(3) saturate(0)}}

/* white-hot core, gone almost instantly */
.ac-core{position:absolute;inset:22%;border-radius:50%;background:#FFF7E2;
  box-shadow:0 0 34px 14px rgba(255,230,170,.95);animation:accore .22s ease-out forwards}
@keyframes accore{0%{transform:scale(.15);opacity:1}100%{transform:scale(1.5);opacity:0}}

/* fireball */
.ac-flash{position:absolute;inset:-55%;border-radius:50%;
  background:radial-gradient(circle,rgba(255,240,200,1) 0%,rgba(255,166,54,.92) 26%,rgba(226,74,26,.55) 50%,transparent 72%);
  animation:acflash .46s cubic-bezier(.15,.75,.3,1) forwards}
@keyframes acflash{0%{transform:scale(.18);opacity:1}55%{opacity:.95}100%{transform:scale(2.1);opacity:0}}

/* two shockwave rings at different speeds */
.ac-shock{position:absolute;inset:8%;border-radius:50%;border:3px solid rgba(255,196,120,.9);
  animation:acshock .55s cubic-bezier(.1,.85,.25,1) forwards}
.ac-shock--2{animation-duration:.82s;animation-delay:.07s;border-width:2px;border-color:rgba(255,140,60,.5)}
@keyframes acshock{0%{transform:scale(.2);opacity:1}100%{transform:scale(3.4);opacity:0;border-width:1px}}

/* shrapnel thrown outward on individual vectors */
.ac-shard{position:absolute;left:50%;top:50%;width:13%;height:13%;margin:-6.5% 0 0 -6.5%;
  border-radius:2px;background:linear-gradient(180deg,#FFD79A,#C2551E);
  transform:rotate(var(--a)) translateY(0) scale(var(--s));
  animation:acshard var(--t) cubic-bezier(.15,.7,.35,1) forwards}
@keyframes acshard{
  0%{transform:rotate(var(--a)) translateY(0) scale(var(--s));opacity:1}
  100%{transform:rotate(var(--a)) translateY(calc(var(--d) * -1)) rotate(180deg) scale(0);opacity:0}}

/* smoke drifting off the crater afterwards */
.ac-smoke{position:absolute;left:50%;top:50%;width:36%;height:36%;margin:-18% 0 0 -18%;
  border-radius:50%;background:radial-gradient(circle,rgba(96,92,86,.62),transparent 72%);
  transform:rotate(var(--a)) translateY(0) scale(.35);
  animation:acsmoke var(--t) ease-out forwards .1s}
@keyframes acsmoke{
  0%{transform:rotate(var(--a)) translateY(0) scale(.35);opacity:.85}
  100%{transform:rotate(var(--a)) translateY(calc(var(--d) * -1)) scale(1.7);opacity:0}}

/* scorch mark left behind on the ground */
.ac-scorch{position:absolute;inset:-14%;border-radius:50%;
  background:radial-gradient(circle,rgba(18,10,6,.92) 0%,rgba(24,14,8,.6) 48%,transparent 74%);
  animation:acscorch .95s ease-out forwards}
@keyframes acscorch{0%{transform:scale(.25);opacity:0}22%{opacity:1}100%{transform:scale(1.25);opacity:0}}

.ac-crater{position:absolute;z-index:1;pointer-events:none;animation:accrform .55s cubic-bezier(.2,.9,.3,1) backwards .1s}
@keyframes accrform{0%{transform:scale(1.45);opacity:0}45%{opacity:1}}
.ac-crater span{position:absolute;inset:0;display:block}

/* Ash lip: a pale torn ring so the hole reads against dark terrain.
   Without this the crater was black-on-black and effectively invisible. */
.ac-crater-rim{inset:-6%;
  background:conic-gradient(from 20deg,#6B5B4A,#8A7660,#4E4235,#7D6A55,#5A4C3E,#8E7A63,#6B5B4A);
  filter:saturate(.7)}

/* the pit itself, sunk inside the lip */
.ac-crater-pit{inset:9%;
  background:
    radial-gradient(58% 50% at 40% 30%, rgba(150,86,44,.34) 0%, transparent 62%),
    radial-gradient(circle at 50% 46%, #2B1A12 0%, #150C08 44%, #030202 80%);
  box-shadow:inset 0 4px 7px rgba(255,163,86,.30), inset 0 -6px 12px rgba(0,0,0,.95)}

/* embers deep in the hole */
.ac-crater-soot{inset:9%;
  background:
    radial-gradient(11% 9% at 38% 62%, rgba(255,120,40,.85), transparent 68%),
    radial-gradient(8% 7% at 63% 45%, rgba(255,170,70,.72), transparent 68%),
    radial-gradient(7% 6% at 52% 76%, rgba(220,84,24,.68), transparent 68%);
  animation:acembers 3s ease-in-out infinite}
@keyframes acembers{50%{opacity:.45;filter:brightness(1.4)}}

/* four torn outlines, applied to lip and pit alike so the silhouette is jagged */
.ac-crater--0 .ac-crater-rim,.ac-crater--0 .ac-crater-pit,.ac-crater--0 .ac-crater-soot{
  clip-path:polygon(14% 22%,33% 6%,52% 17%,72% 4%,90% 24%,96% 45%,84% 66%,92% 86%,68% 94%,47% 85%,26% 96%,9% 76%,4% 52%)}
.ac-crater--1 .ac-crater-rim,.ac-crater--1 .ac-crater-pit,.ac-crater--1 .ac-crater-soot{
  clip-path:polygon(7% 34%,26% 11%,48% 22%,66% 3%,88% 18%,98% 40%,88% 58%,97% 81%,74% 90%,55% 97%,33% 87%,15% 94%,4% 66%)}
.ac-crater--2 .ac-crater-rim,.ac-crater--2 .ac-crater-pit,.ac-crater--2 .ac-crater-soot{
  clip-path:polygon(18% 10%,40% 20%,58% 5%,82% 15%,94% 36%,86% 54%,98% 74%,77% 84%,60% 97%,36% 88%,18% 97%,5% 72%,11% 44%)}
.ac-crater--3 .ac-crater-rim,.ac-crater--3 .ac-crater-pit,.ac-crater--3 .ac-crater-soot{
  clip-path:polygon(12% 28%,30% 15%,46% 26%,64% 10%,84% 7%,96% 30%,87% 50%,95% 72%,72% 81%,58% 94%,34% 85%,13% 90%,3% 60%)}

/* ---- scorch bleeding onto the surviving squares next to a blast ---- */
.ac-char{position:absolute;pointer-events:none;mix-blend-mode:multiply;animation:acfade .5s ease .18s backwards}
@keyframes acfade{from{opacity:0}}
.ac-char--n,.ac-char--s{left:0;right:0;height:40%}
.ac-char--e,.ac-char--w{top:0;bottom:0;width:40%}
.ac-char--n{top:0;background:linear-gradient(to bottom,rgba(28,17,11,.72),rgba(40,26,16,.22) 45%,transparent)}
.ac-char--s{bottom:0;background:linear-gradient(to top,rgba(28,17,11,.72),rgba(40,26,16,.22) 45%,transparent)}
.ac-char--w{left:0;background:linear-gradient(to right,rgba(28,17,11,.72),rgba(40,26,16,.22) 45%,transparent)}
.ac-char--e{right:0;background:linear-gradient(to left,rgba(28,17,11,.72),rgba(40,26,16,.22) 45%,transparent)}
.ac-char--ne,.ac-char--nw,.ac-char--se,.ac-char--sw{width:46%;height:46%}
.ac-char--ne{top:0;right:0;background:radial-gradient(circle at 100% 0,rgba(28,17,11,.6),transparent 72%)}
.ac-char--nw{top:0;left:0;background:radial-gradient(circle at 0 0,rgba(28,17,11,.6),transparent 72%)}
.ac-char--se{bottom:0;right:0;background:radial-gradient(circle at 100% 100%,rgba(28,17,11,.6),transparent 72%)}
.ac-char--sw{bottom:0;left:0;background:radial-gradient(circle at 0 100%,rgba(28,17,11,.6),transparent 72%)}

/* ---- pieces rocked by a nearby blast, settling back onto their square ---- */
.ac-piece.is-jolt .ac-svg{animation:acjolt .74s cubic-bezier(.24,.9,.32,1)}
@keyframes acjolt{
  0%{transform:translate(0,0) rotate(0)}
  9%{transform:translate(calc(var(--jx) * 17%),calc(var(--jy) * 17%)) rotate(calc(var(--jx) * 13deg))}
  26%{transform:translate(calc(var(--jx) * -8%),calc(var(--jy) * -8%)) rotate(calc(var(--jx) * -8deg))}
  45%{transform:translate(calc(var(--jx) * 5%),calc(var(--jy) * 5%)) rotate(calc(var(--jx) * 5deg))}
  64%{transform:translate(calc(var(--jx) * -3%),calc(var(--jy) * -3%)) rotate(calc(var(--jx) * -2.5deg))}
  82%{transform:translate(calc(var(--jx) * 1.5%),calc(var(--jy) * 1.5%)) rotate(calc(var(--jx) * 1deg))}
  100%{transform:translate(0,0) rotate(0)}}

.ac-result{margin-top:14px;background:linear-gradient(180deg,var(--ink3),var(--ink2));
  border:1px solid var(--edge);border-radius:16px;padding:18px 16px 20px;
  animation:acu .34s cubic-bezier(.2,.95,.3,1)}
.ac-result h2{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:20px;
  letter-spacing:-.02em;color:var(--cream);margin:0 0 4px}
.ac-result h2.ac-win{color:var(--amber);animation:acglow 1.6s ease-in-out infinite}
.ac-result .ac-note{margin-bottom:14px}

.ac-dialrow{padding:14px 0 4px;border-bottom:1px solid var(--edge)}
.ac-dialhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;font-size:13px}
.ac-dialhead strong{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:14px;
  background:linear-gradient(92deg,var(--cream),var(--amber));-webkit-background-clip:text;background-clip:text;color:transparent}
.ac-slider{display:block;margin-bottom:16px}
.ac-sliderlabel{display:flex;justify-content:space-between;font-size:11.5px;color:#9FC0BC;margin-bottom:7px}
.ac-sliderlabel em{font-style:normal;color:var(--sea);font-weight:600}
.ac-slider input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:26px;background:transparent;cursor:pointer;display:block}
.ac-slider input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:99px;
  background:linear-gradient(90deg,var(--sea),var(--amber))}
.ac-slider input[type=range]::-moz-range-track{height:5px;border-radius:99px;
  background:linear-gradient(90deg,var(--sea),var(--amber))}
.ac-slider input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
  width:21px;height:21px;margin-top:-8px;border-radius:50%;background:var(--cream);
  border:3px solid var(--ink2);box-shadow:0 2px 8px rgba(0,0,0,.55);transition:transform .15s}
.ac-slider input[type=range]::-moz-range-thumb{width:21px;height:21px;border-radius:50%;
  background:var(--cream);border:3px solid var(--ink2);box-shadow:0 2px 8px rgba(0,0,0,.55)}
.ac-slider input[type=range]:active::-webkit-slider-thumb{transform:scale(1.22)}
.ac-ticks{display:flex;justify-content:space-between;margin-top:4px}
.ac-ticks i{font-style:normal;font-size:9.5px;color:#6E8C89}

/* ---- shifting ground ---- */
.ac-fault{font-size:11px;color:#9FC0BC;border:1px solid var(--edge);border-radius:999px;padding:2px 8px}
.ac-fault[data-soon="true"]{color:#FFC96B;border-color:rgba(255,201,107,.65);
  animation:acfault 1.05s ease-in-out infinite}
@keyframes acfault{50%{box-shadow:0 0 14px -3px rgba(255,201,107,.85);border-color:#FFC96B}}

/* the plate braces before it goes */
.ac-sq.is-shifting{z-index:2;
  box-shadow:inset 0 0 0 2px rgba(255,201,107,.9),0 6px 18px -4px rgba(0,0,0,.8);
  animation:acbrace .42s cubic-bezier(.3,.8,.4,1)}
@keyframes acbrace{
  0%{filter:brightness(1)}
  30%{filter:brightness(1.3)}
  55%{transform:scale(1.05)}
  100%{filter:brightness(1.12);transform:scale(1.03)}}

.ac-rules{font-size:11px;line-height:1.55;color:#B9D2CD;background:rgba(255,155,106,.07);
  border:1px solid rgba(255,155,106,.22);border-radius:11px;padding:11px 12px;margin:0 0 11px}

.ac-moves{display:flex;gap:9px;overflow-x:auto;padding:14px 2px 4px;scrollbar-width:none;font-size:13px;white-space:nowrap}
.ac-moves::-webkit-scrollbar{display:none}
.ac-move{color:var(--cream);animation:acslide .3s ease}
.ac-move em{color:#7FAFA8;font-style:normal;margin-right:3px;font-size:11px}
.ac-empty{color:#7FAFA8;font-size:12px}

.ac-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px;border-top:1px solid var(--edge);padding-top:12px}
.ac-bar button{background:transparent;border:0;color:var(--sand);font-family:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:7px 0;cursor:pointer;border-radius:9px;transition:background .2s}
.ac-bar button span{font-size:17px;color:var(--sea);transition:transform .2s}
.ac-bar button:hover:not(:disabled){background:var(--ink2)}
.ac-bar button:hover:not(:disabled) span{transform:translateY(-2px) scale(1.12)}
.ac-bar button:active:not(:disabled) span{transform:scale(.88)}
.ac-bar button:disabled{opacity:.3;cursor:default}

.ac-sheet{position:fixed;inset:0;background:rgba(3,12,16,.74);backdrop-filter:blur(7px);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:acf .18s ease}
@keyframes acf{from{opacity:0}}
.ac-sheetbody{background:linear-gradient(180deg,var(--ink3),var(--ink2));border:1px solid var(--edge);border-bottom:0;border-radius:20px 20px 0 0;padding:22px 18px 30px;width:100%;max-width:520px;max-height:86vh;overflow-y:auto;animation:acu .3s cubic-bezier(.2,.95,.3,1)}
@keyframes acu{from{transform:translateY(30px);opacity:0}}
.ac-sheetbody h2{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:21px;letter-spacing:-0.02em;color:var(--cream);margin:0 0 4px}
.ac-sheetbody h2.ac-win{color:var(--amber);animation:acglow 1.6s ease-in-out infinite}
@keyframes acglow{50%{text-shadow:0 0 22px rgba(245,160,60,.6)}}
.ac-note{font-size:11.5px;color:#9FC0BC;margin:0 0 16px}
.ac-note--tight{margin:10px 0 14px}
.ac-tabs{display:flex;gap:6px;margin-bottom:12px}
.ac-tabs button{flex:1;min-width:0;padding-left:4px;padding-right:4px;background:var(--ink3);border:1px solid var(--edge);color:#9FC0BC;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:13px;padding:9px;border-radius:10px;cursor:pointer;transition:background .2s,color .2s}
.ac-tabs button[data-on="true"]{background:var(--sand);color:var(--slate);border-color:var(--sand)}

.ac-fields{display:flex;flex-direction:column;gap:9px}
.ac-fieldcard{display:flex;align-items:center;gap:12px;text-align:left;background:var(--ink3);border:1px solid var(--edge);border-radius:12px;padding:10px;cursor:pointer;transition:border-color .2s,transform .15s,box-shadow .2s;animation:acu .3s backwards}
.ac-fieldcard:hover{border-color:var(--amber);transform:translateY(-2px);box-shadow:0 10px 24px -12px var(--amber)}
.ac-fieldcard .ac-thumb{width:84px;flex:none}
.ac-fieldtext{display:flex;flex-direction:column;gap:3px}
.ac-fieldname{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:15px;color:var(--cream)}
.ac-fieldname em{font-family:'IBM Plex Mono',monospace;font-style:normal;font-size:10px;color:var(--amber);margin-left:5px}
.ac-fieldblurb{font-size:10.5px;line-height:1.4;color:#9FC0BC}

.ac-shapes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.ac-shapecard{background:var(--ink3);border:1px solid var(--edge);border-radius:12px;padding:9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:7px;transition:border-color .2s,transform .15s}
.ac-shapecard:hover{border-color:var(--amber);transform:translateY(-2px)}
.ac-shapename{font-size:10.5px;color:var(--sand)}
.ac-thumb{display:grid;width:100%;gap:1px}
.ac-thumb i{border-radius:1px}
.ac-thumb i.l{background:var(--sand)} .ac-thumb i.d{background:var(--teal)} .ac-thumb i.x{background:rgba(87,214,194,.09)}
.ac-rollbtn{width:100%;background:linear-gradient(100deg,var(--amber),#E8842A);color:#20180B;border:0;border-radius:12px;padding:14px;margin-top:6px;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:14px;cursor:pointer;transition:filter .2s,transform .12s}
.ac-rollbtn:hover{filter:brightness(1.08)}
.ac-rollbtn:active{transform:scale(.98)}
.ac-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--edge);font-size:13px}
.ac-toggle{background:var(--ink3);border:1px solid var(--edge);color:#9FC0BC;border-radius:999px;padding:6px 15px;font-family:inherit;font-size:12px;cursor:pointer;transition:background .2s,color .2s}
.ac-toggle[data-on="true"]{background:var(--sea);color:#062621;border-color:var(--sea)}
.ac-seg{display:flex;gap:4px}
.ac-seg button{background:var(--ink3);border:1px solid var(--edge);color:#9FC0BC;font-family:inherit;font-size:11px;padding:6px 10px;border-radius:8px;cursor:pointer}
.ac-seg button[data-on="true"]{background:var(--sea);color:#062621;border-color:var(--sea)}
.ac-promos{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:6px}
.ac-promos button{background:var(--sand);border:0;border-radius:12px;padding:10px 0;cursor:pointer;transition:transform .15s,background .2s}
.ac-promos button:hover{transform:translateY(-3px);background:var(--cream)}
svg.ac-promoicon{width:38px;height:38px}
.ac-promoicon path{fill:var(--slate);stroke:var(--slate);stroke-width:4}
.ac-root.ac-still *{animation:none!important;transition:none!important}
